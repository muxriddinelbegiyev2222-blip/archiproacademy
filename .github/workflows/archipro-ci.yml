name: ARCHIPRO CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Project audit
        shell: pwsh
        run: python app/tools/project_audit.py

      - name: Database audit
        shell: pwsh
        run: python app/tools/database_audit.py

      - name: Runtime smoke test
        shell: pwsh
        run: python app/tools/runtime_smoke_test.py

      - name: Customer features smoke test
        shell: pwsh
        run: python app/tools/customer_features_smoke_test.py

      - name: UI navigation smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python app/tools/ui_navigation_smoke_test.py

      - name: Learning flow smoke test
        shell: pwsh
        run: python app/tools/learning_flow_smoke_test.py

      - name: Full curriculum release regression
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          ARCHIPRO_AUDIT_MODE: "1"
          PYTHONIOENCODING: utf-8
        run: python app/tools/release_regression_test.py



  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client build dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows client with embedded course modules
        shell: pwsh
        run: |
          python app/tools/build_client.py

      - name: Verify curriculum in the actual Windows EXE
        shell: pwsh
        run: python app/tools/verify_built_exe.py "dist/ARCHIPRO UZ.exe"

      # Optional download convenience: storage quota must not mask audit/build results.
      - name: Upload verified Windows client
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ARCHIPRO_UZ_Client_1.0.5
          path: dist/ARCHIPRO UZ.exe
          if-no-files-found: error
          retention-days: 7
