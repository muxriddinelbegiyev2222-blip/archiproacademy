name: ARCHIPRO Original Lesson Marketing Album

on:
  push:
    branches: [main]
    paths:
      - 'marketing/make_real_lesson_album.py'
      - '.github/workflows/marketing-original-album.yml'
  workflow_dispatch:

jobs:
  publish-album:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out actual course assets
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tools
        run: python -m pip install 'reportlab>=4.0' 'Pillow>=10' 'python-pptx>=0.6.23' 'PyMuPDF>=1.23'

      - name: Generate PDF and PowerPoint from original lesson illustrations
        run: python marketing/make_real_lesson_album.py

      - name: Confirm ten PDF pages and ten PowerPoint slides
        run: |
          python - <<'PY'
          from pathlib import Path
          from reportlab.pdfbase.pdfmetrics import stringWidth
          from pptx import Presentation
          import fitz
          folder=Path('marketing_output')
          pdf=folder/'ARCHIPRO_UZ_10_sahifali_ASL_DARS_ESKIZLARI.pdf'
          ppt=folder/'ARCHIPRO_UZ_10_slaydli_ASL_DARS_ESKIZLARI.pptx'
          assert pdf.is_file() and pdf.stat().st_size>1000000
          assert ppt.is_file() and ppt.stat().st_size>1000000
          assert len(fitz.open(pdf))==10
          assert len(Presentation(ppt).slides)==10
          print('PASS: source-based original 10-page PDF and 10-slide PPTX')
          PY
        env:
          PYTHONUNBUFFERED: '1'

      - name: Upload finished customer marketing files
        uses: actions/upload-artifact@v4
        with:
          name: ARCHIPRO_10_sahifa_ASL_DARS_RASMLARI
          path: marketing_output/*
          if-no-files-found: error
          retention-days: 30
