<text x="250" y="835" font-size="27" font-weight="700">MOS TAYANCH ZANJIRI</text><text x="930" y="835" font-size="27" font-weight="700" fill="#a45e3b">SILJIGAN DEVOR — TEKSHIRUV</text><path d="M1070 665 C1110 665 1120 665 1140 665" stroke="#a45e3b" stroke-width="6" fill="none"/><text x="1080" y="630" font-size="22" fill="#a45e3b">siljish</text>
<text x="180" y="900" font-size="22">Plan, kesim va o‘qlar bir xil holatni ko‘rsatishi kerak. Yuqori devor pastdagi tayanchdan siljisa alohida yechim talab qilishi mumkin.</text><text x="70" y="984" font-size="18" fill="#6c6a63">Konseptual koordinatsiya eskizi; transfer yechimi ko‘rsatilmagan.</text></g></svg>