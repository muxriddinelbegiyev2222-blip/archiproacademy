<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L02_M02_005  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Zonalashdagi tipik xatolar</text><text x="45" y="155" font-size="17" fill="#0E5558">Kirish, mehmonxona, oshxona, ikki yotoqxona va sanuzelni aloqa sxemasiga birlashtiramiz.</text><g transform="translate(0,80)"><line x1="210" y1="370" x2="455" y2="235" stroke="#0E5558" stroke-width="5"/><line x1="210" y1="370" x2="455" y2="510" stroke="#0E5558" stroke-width="5"/><line x1="455" y1="235" x2="765" y2="235" stroke="#0E5558" stroke-width="5"/><line x1="765" y1="235" x2="765" y2="510" stroke="#0E5558" stroke-width="5"/><line x1="455" y1="235" x2="455" y2="510" stroke="#A65D35" stroke-width="3" stroke-dasharray="9 7"/><circle cx="210" cy="370" r="85" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="145" y="378" font-size="22" fill="#0E5558">KIRISH</text><circle cx="455" cy="235" r="85" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="390" y="243" font-size="22" fill="#0E5558">MEHMON</text><circle cx="455" cy="510" r="85" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="390" y="518" font-size="22" fill="#0E5558">TINCH</text><circle cx="765" cy="235" r="85" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="700" y="243" font-size="22" fill="#0E5558">OSHXONA</text><circle cx="765" cy="510" r="85" fill="#F1DFC6" stroke="#0E5558" stroke-width="3"/><text x="700" y="518" font-size="22" fill="#0E5558">HOVLI</text><text x="75" y="665" font-size="22" fill="#0E5558">Uzluksiz chiziq: aloqa. Uzilgan chiziq: ajratishni tekshirish.</text><text x="70" y="145" font-size="20" fill="#A65D35">OSHXONA — OVQATLANISH: YAQIN</text><text x="70" y="178" font-size="20" fill="#A65D35">MEHMON — UYQU: AJRATISH</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Kirishdan yotoqxonaga majburiy mehmon yo‘lini toping va eshikni yo‘lakka ko‘chiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>