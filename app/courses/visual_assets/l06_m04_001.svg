<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L06_M04_001  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Composite Structure tushunchasi</text><text x="45" y="155" font-size="17" fill="#0E5558">O‘quv devor qatlamlari 15+200+100+15 mm; jami 330 mm. Tarkib haqiqiy loyiha talabi emas.</text><g transform="translate(0,80)"><rect x="180" y="265" width="30" height="220" fill="#FFFDF7" stroke="#203B36" stroke-width="3"/><text x="90" y="200" font-size="21" fill="#0E5558">Pardoz</text><line x1="125" y1="210" x2="195.0" y2="255" stroke="#0E5558" stroke-width="2"/><text x="95" y="555" font-size="21" fill="#0E5558">15 mm</text><line x1="195.0" y1="490" x2="125" y2="525" stroke="#0E5558" stroke-width="2"/><rect x="210" y="265" width="400" height="220" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><text x="360" y="200" font-size="21" fill="#0E5558">Yadro</text><line x1="420" y1="210" x2="410.0" y2="255" stroke="#0E5558" stroke-width="2"/><text x="350" y="555" font-size="21" fill="#0E5558">200 mm</text><line x1="410.0" y1="490" x2="400" y2="525" stroke="#0E5558" stroke-width="2"/><rect x="610" y="265" width="200" height="220" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><text x="610" y="200" font-size="21" fill="#0E5558">Izolyatsiya</text><line x1="685" y1="210" x2="710.0" y2="255" stroke="#0E5558" stroke-width="2"/><text x="630" y="555" font-size="21" fill="#0E5558">100 mm</text><line x1="710.0" y1="490" x2="680" y2="525" stroke="#0E5558" stroke-width="2"/><rect x="810" y="265" width="30" height="220" fill="#FFFDF7" stroke="#203B36" stroke-width="3"/><text x="890" y="200" font-size="21" fill="#0E5558">Pardoz</text><line x1="930" y1="210" x2="825.0" y2="255" stroke="#0E5558" stroke-width="2"/><text x="890" y="555" font-size="21" fill="#0E5558">15 mm</text><line x1="825.0" y1="490" x2="925" y2="525" stroke="#0E5558" stroke-width="2"/><text x="230" y="630" font-size="30" fill="#A65D35">15 + 200 + 100 + 15 = 330 mm</text><rect x="180" y="265" width="30" height="220" fill="none" stroke="#A65D35" stroke-width="5"/></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Composite tuzilmasini alohida skinlarga ajrating</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>