<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L02_M07_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Yoshga mos rejalashtirish</text><text x="45" y="155" font-size="17" fill="#0E5558">Bolalar xonasida uyqu, o‘qish, o‘yin va saqlash zonalari bor; yosh va nazorat ehtiyoji aniqlanadi.</text><g transform="translate(0,80)"><rect x="145" y="190" width="720" height="390" fill="#FFFDF7" stroke="#0E5558" stroke-width="8"/><line x1="420" y1="580" x2="510" y2="580" stroke="#FFFDF7" stroke-width="12"/><line x1="420" y1="575" x2="420" y2="485" stroke="#0E5558" stroke-width="3"/><path d="M510,575 A90,90 0 0,0 420,485" fill="none" stroke="#0E5558" stroke-width="2"/><line x1="330" y1="190" x2="475" y2="190" stroke="#D5E7ED" stroke-width="12"/><rect x="200" y="240" width="140" height="220" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="390" y="220" width="160" height="70" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><circle cx="605" cy="400" r="90" fill="#F1DFC6" stroke="#0E5558" stroke-width="3"/><rect x="775" y="235" width="60" height="250" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><text x="190" y="500" font-size="22" fill="#0E5558">UYQU</text><text x="405" y="205" font-size="22" fill="#0E5558">O‘QISH</text><text x="560" y="405" font-size="24" fill="#0E5558">O‘YIN</text><text x="695" y="530" font-size="22" fill="#0E5558">SAQLASH</text><rect x="390" y="220" width="160" height="70" fill="none" stroke="#A65D35" stroke-width="5"/></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Bola yoshiga mos mebel o‘lchamini tanlang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>