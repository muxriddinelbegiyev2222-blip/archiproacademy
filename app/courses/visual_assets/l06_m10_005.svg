      <rect x="450" y="275" width="105" height="125" rx="16" fill="#e5e2c9"/>
    </g>
    <g stroke-width="3" fill="#fffef9">
      <rect x="120" y="125" width="118" height="65" rx="10"/><path d="M140 145 H220 M140 164 H210" stroke="#71858a"/>
      <rect x="115" y="305" width="150" height="68" rx="10"/><path d="M135 325 H245 M135 345 H220" stroke="#71858a"/>
      <rect x="465" y="305" width="75" height="68" rx="10"/><path d="M477 325 H528 M477 345 H520" stroke="#71858a"/>
    </g>
