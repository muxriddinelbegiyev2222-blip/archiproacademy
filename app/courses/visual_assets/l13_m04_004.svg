<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L13_M04_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Mijozga variantlarni ko&#x27;rsatish</text><text x="45" y="155" font-size="17" fill="#0E5558">A variant mehmon zonasini ajratadi, B variant hovli aloqasini kuchaytiradi; bir xil brief bo‘yicha taqqoslanadi.</text><g transform="translate(0,80)"><rect x="110" y="230" width="410" height="270" fill="#FFFDF7" stroke="#0E5558" stroke-width="5"/><rect x="125" y="245" width="170" height="110" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="340" y="245" width="160" height="110" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="135" y="200" font-size="23" fill="#0E5558">A: MEHMON AJRALGAN</text><line x1="305" y1="470" x2="305" y2="365" stroke="#A65D35" stroke-width="4"/><path d="M305, 365 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-90.0 305 365)"/><line x1="305" y1="365" x2="410" y2="365" stroke="#A65D35" stroke-width="4"/><path d="M410, 365 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 410 365)"/><rect x="635" y="230" width="410" height="270" fill="#FFFDF7" stroke="#0E5558" stroke-width="5"/><rect x="650" y="245" width="170" height="110" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="865" y="245" width="160" height="110" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="660" y="200" font-size="23" fill="#0E5558">B: HOVLI ALOQASI</text><line x1="830" y1="470" x2="830" y2="365" stroke="#A65D35" stroke-width="4"/><path d="M830, 365 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-90.0 830 365)"/><line x1="830" y1="365" x2="935" y2="365" stroke="#A65D35" stroke-width="4"/><path d="M935, 365 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 935 365)"/><text x="135" y="615" font-size="25" fill="#A65D35">Bir xil mezon: privacy / yo‘l / hovli / texnik murakkablik</text><circle cx="705" cy="680" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="698" y="688" font-size="22" fill="#FFFDF7">4</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Har variant foydasi va yo‘qotishini sodda tilda tushuntiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>