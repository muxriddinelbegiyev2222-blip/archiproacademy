ize="19" fill="#203B36">Mavjudligini tekshir</text><rect x="80" y="391" width="260" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="427" font-size="19" fill="#203B36">Zone</text><rect x="340" y="391" width="365" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="350" y="427" font-size="19" fill="#203B36">Xona / makon sinfi</text><rect x="705" y="391" width="395" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="715" y="427" font-size="19" fill="#203B36">Mavjudligini tekshir</text><text x="145" y="545" font-size="24" fill="#0E5558">Sinfning nomi tanlangan classification tizimiga bog‘liq.</text><text x="145" y="615" font-size="25" fill="#A65D35">Noto‘g‘ri sinf → noto‘g‘ri maydon yoki jadval mezoni.</text><circle cx="900" cy="680" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="893" y="688" font-size="22" fill="#FFFDF7">5</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Noto‘g‘ri classificationni elementdan tuzating</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>