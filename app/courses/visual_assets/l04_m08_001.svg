<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L04_M08_001  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Fasad nimani ifodalaydi?</text><text x="45" y="155" font-size="17" fill="#0E5558">Fasadning mahalliy ifodasi ayvon, soya, material va kirish orqali quriladi.</text><g transform="translate(0,80)"><rect x="140" y="310" width="800" height="210" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><line x1="110" y1="520" x2="990" y2="520" stroke="#0E5558" stroke-width="5"/><rect x="560" y="385" width="60" height="135" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><rect x="276.0" y="355" width="68" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="310" y1="355" x2="310" y2="450" stroke="#0E5558" stroke-width="2"/><rect x="441.0" y="355" width="68" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="475" y1="355" x2="475" y2="450" stroke="#0E5558" stroke-width="2"/><rect x="661.0" y="355" width="68" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="695" y1="355" x2="695" y2="450" stroke="#0E5558" stroke-width="2"/><rect x="826.0" y="355" width="68" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="860" y1="355" x2="860" y2="450" stroke="#0E5558" stroke-width="2"/><circle cx="150" cy="275" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="143" y="283" font-size="22" fill="#FFFDF7">1</text><text x="177" y="283" font-size="21" fill="#0E5558">Hajm / ochilish</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Plandagi xonalar va ochilishlarni fasadga olib chiqing</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum