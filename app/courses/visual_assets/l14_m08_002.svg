<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L14_M08_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Case 1: murakkab site</text><text x="45" y="155" font-size="17" fill="#0E5558">Uch case: tor site, ko‘p avlodli oila va konstruktiv/estetik konflikt; bir xil tahlil mezoni qo‘llanadi.</text><g transform="translate(0,80)"><rect x="450" y="195" width="120" height="400" fill="#DBE9E2" stroke="#0E5558" stroke-width="4"/><rect x="465" y="235" width="90" height="315" fill="#E9E1D3" stroke="#0E5558" stroke-width="3"/><rect x="465" y="335" width="90" height="75" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><line x1="420" y1="600" x2="600" y2="600" stroke="#0E5558" stroke-width="2"/><rect x="380" y="640" width="260" height="35" fill="#E9E1D3" stroke="#0E5558" stroke-width="2"/><line x1="395" y1="280" x2="395" y2="200" stroke="#0E5558" stroke-width="4"/><path d="M395, 200 l-12,-5 l0,10 Z" fill="#0E5558" transform="rotate(-90.0 395 200)"/><text x="345" y="175" font-size="21" fill="#0E5558">SHIMOL</text><line x1="450" y1="625" x2="570" y2="625" stroke="#0E5558" stroke-width="2"/><line x1="450" y1="617" x2="450" y2="633" stroke="#0E5558" stroke-width="2"/><line x1="570" y1="617" x2="570" y2="633" stroke="#0E5558" stroke-width="2"/><text x="468.0" y="613" font-size="21" fill="#0E5558">12 m</text><text x="600" y="405" font-size="23" fill="#0E5558">40 m</text><text x="660" y="275" font-size="23" fill="#0E5558">Umumiy zona</text><line x1="560" y1="275" x2="645" y2="275" stroke="#0E5558" stroke-width="2"/><text x="660" y="375" font-size="23" fill="#0E5558">Ichki hovli</text><line x1="560" y1="375" x2="645" y2="375" stroke="#0E5558" stroke-width="2"/><text x="660" y="490" font-size="23" fill="#0E5558">Tinch zona</text><line x1="560" y1="490" x2="645" y2="490" stroke="#0E5558" stroke-width="2"/><line x1="475" y1="585" x2="475" y2="250" stroke="#A65D35" stroke-width="4"/><path d="M475, 250 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-90.0 475 250)"/><circle cx="700" cy="555" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="693" y="563" font-size="22" fill="#FFFDF7">2</text><text x="285" y="710" font-size="23" fill="#0E5558">480 m²: kenglik va yorug‘lik masalasi alohida tekshiriladi.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Tor site uchun kirish/yorug‘lik ikki variantini solishtiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>