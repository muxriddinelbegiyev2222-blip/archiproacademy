<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L01_M03_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Ritmni ataylab buzish</text><text x="45" y="155" font-size="17" fill="#0E5558">Uch deraza markazi x=2, 5 va 8 m nuqtalarda. Takrorlash oralig‘i 3 m.</text><g transform="translate(0,80)"><rect x="140" y="310" width="800" height="210" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><line x1="110" y1="520" x2="990" y2="520" stroke="#0E5558" stroke-width="5"/><rect x="560" y="385" width="60" height="135" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><rect x="226.0" y="355" width="68" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="260" y1="355" x2="260" y2="450" stroke="#0E5558" stroke-width="2"/><rect x="436.0" y="355" width="68" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="470" y1="355" x2="470" y2="450" stroke="#0E5558" stroke-width="2"/><rect x="646.0" y="355" width="68" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="680" y1="355" x2="680" y2="450" stroke="#0E5558" stroke-width="2"/><line x1="260" y1="575" x2="470" y2="575" stroke="#0E5558" stroke-width="2"/><line x1="260" y1="567" x2="260" y2="583" stroke="#0E5558" stroke-width="2"/><line x1="470" y1="567" x2="470" y2="583" stroke="#0E5558" stroke-width="2"/><text x="323.0" y="563" font-size="21" fill="#0E5558">3 m</text><line x1="470" y1="575" x2="680" y2="575" stroke="#0E5558" stroke-width="2"/><line x1="470" y1="567" x2="470" y2="583" stroke="#0E5558" stroke-width="2"/><line x1="680" y1="567" x2="680" y2="583" stroke="#0E5558" stroke-width="2"/><text x="533.0" y="563" font-size="21" fill="#0E5558">3 m</text><text x="240" y="625" font-size="23" fill="#A65D35">x = 2 m             x = 5 m             x = 8 m</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Kirishga yaqin intervalni ataylab o‘zgartiring va sababini yozing</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>