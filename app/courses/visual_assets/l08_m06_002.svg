<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L08_M06_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Fundament va yer bilan tutashuv</text><text x="45" y="155" font-size="17" fill="#0E5558">Nam xona pol-devor tutashuvi, balkon va yerga tegadigan devor uch xil suv manbasiga ega.</text><g transform="translate(0,80)"><rect x="230" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="795" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="230" y="365" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="230" y="555" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><line x1="230" y1="220" x2="535" y2="130" stroke="#0E5558" stroke-width="6"/><line x1="535" y1="130" x2="840" y2="220" stroke="#0E5558" stroke-width="6"/><text x="855" y="378" font-size="22" fill="#0E5558">+3.000</text><text x="855" y="580" font-size="22" fill="#0E5558">±0.000</text><line x1="280" y1="255" x2="280" y2="555" stroke="#A65D35" stroke-width="12"/><line x1="285" y1="550" x2="795" y2="550" stroke="#A65D35" stroke-width="12"/><rect x="840" y="365" width="140" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><line x1="400" y1="490" x2="400" y2="540" stroke="#A65D35" stroke-width="4"/><path d="M400, 540 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(90.0 400 540)"/><line x1="280" y1="490" x2="280" y2="545" stroke="#2387A8" stroke-width="8"/><line x1="280" y1="545" x2="640" y2="545" stroke="#2387A8" stroke-width="8"/><text x="350" y="680" font-size="26" fill="#0E5558">Suv manbai / uzluksiz himoya / chiqarish</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Yer bilan tutashuv kesimida himoya va chiqarish yo‘lini ko‘rsating</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>