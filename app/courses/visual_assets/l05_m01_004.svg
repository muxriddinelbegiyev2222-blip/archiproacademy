<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L05_M01_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Zoom, Pan va tanlash</text><text x="45" y="155" font-size="17" fill="#0E5558">Bo‘sh Archicad loyihasida bitta devor yaratiladi; plan va 3Dda bir elementni kuzatamiz. Ko‘rsatmalar Archicad 28</text><text x="45" y="181" font-size="17" fill="#0E5558">INT atamalariga tayangan.</text><g transform="translate(0,80)"><line x1="160" y1="345" x2="450" y2="345" stroke="#0E5558" stroke-width="18"/><text x="175" y="275" font-size="25" fill="#0E5558">FLOOR PLAN: 2D</text><polygon points="660,400 950,270 970,290 680,420" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><polygon points="660,400 950,270 950,480 660,610" fill="#C9AD84" stroke="#0E5558" stroke-width="3"/><text x="730" y="245" font-size="25" fill="#0E5558">3D: AYNI DEVOR</text><line x1="470" y1="355" x2="620" y2="355" stroke="#A65D35" stroke-width="4"/><path d="M620, 355 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 620 355)"/><text x="155" y="675" font-size="25" fill="#0E5558">Bitta element: asbob → parametr → plan → 3D tekshiruv</text><circle cx="450" cy="400" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="443" y="408" font-size="22" fill="#FFFDF7">4</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Zoom bilan ko‘rish kattaligini, Pan bilan kadrni o‘zgartiring. Arrow orqali devorni tanlang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>