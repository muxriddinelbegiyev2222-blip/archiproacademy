<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L09_M02_005  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Turar joy professional audit</text><text x="45" y="155" font-size="17" fill="#0E5558">Uyda yashash, yordamchi va nam xonalar bor; xonalar vazifasi loyiha talabi va hujjat doirasi bilan bog‘lanadi.</text><g transform="translate(0,80)"><rect x="80" y="205" width="270" height="57" fill="#0E5558" stroke="#0E5558" stroke-width="1"/><text x="90" y="241" font-size="19" fill="#FFFDF7">Savol</text><rect x="350" y="205" width="405" height="57" fill="#0E5558" stroke="#0E5558" stroke-width="1"/><text x="360" y="241" font-size="19" fill="#FFFDF7">Manba / dalil</text><rect x="755" y="205" width="310" height="57" fill="#0E5558" stroke="#0E5558" stroke-width="1"/><text x="765" y="241" font-size="19" fill="#FFFDF7">Holat</text><rect x="80" y="262" width="270" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="298" font-size="19" fill="#203B36">Obyekt turi</text><rect x="350" y="262" width="405" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="360" y="298" font-size="19" fill="#203B36">Turar joy / foydalanish</text><rect x="755" y="262" width="310" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="765" y="298" font-size="19" fill="#203B36">Aniqlash</text><rect x="80" y="319" width="270" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="355" font-size="19" fill="#203B36">Tahrir / sana</text><rect x="350" y="319" width="405" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="360" y="355" font-size="19" fill="#203B36">Rasmiy hujjat</text><rect x="755" y="319" width="310" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="765" y="355" font-size="19" fill="#203B36">Tekshirish</text><rect x="80" y="376" width="270" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="412" font-size="19" fill="#203B36">Band / talab</text><rect x="350" y="376" width="405" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="360" y="412" font-size="19" fill="#203B36">Aniq havola</text><rect x="755" y="376" width="310" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="765" y="412" font-size="19" fill="#203B36">Tekshirish</text><rect x="80" y="433" width="270" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="469" font-size="19" fill="#203B36">Plan / kesim</text><rect x="350" y="433" width="405" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="360" y="469" font-size="19" fill="#203B36">Loyiha revisioni</text><rect x="755" y="433" width="310" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="765" y="469" font-size="19" fill="#203B36">Solishtirish</text><rect x="80" y="490" width="270" height="57" fill="#F1DFC6" stroke="#0E5558" stroke-width="1"/><text x="90" y="526" font-size="19" fill="#203B36">Mas’ul / qayta test</text><rect x="350" y="490" width="405" height="57" fill="#F1DFC6" stroke="#0E5558" stroke-width="1"/><text x="360" y="526" font-size="19" fill="#203B36">Qaror qaydi</text><rect x="755" y="490" width="310" height="57" fill="#F1DFC6" stroke="#0E5558" stroke-width="1"/><text x="765" y="526" font-size="19" fill="#203B36">Yopish</text><text x="95" y="655" font-size="27" fill="#A65D35">Manbasiz raqamni majburiy me’yor deb qo‘llamang.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Har masalaga manba, band, dalil va status yozing</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>