<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#fbfaf4"/>
  
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#53636a" flood-opacity=".16"/>
  </filter>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#e8e2d7"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ecd7ad"/><stop offset="1" stop-color="#c89e62"/>
  </linearGradient>
</defs>
  <g filter="url(#paper)" stroke="#31434a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
<g transform="translate(95 165)" filter="url(#shadow)">
  <g>
    <rect x="0" y="0" width="420" height="420" fill="url(#wall)" stroke-width="12"/>
    <path d="M230 0 V420 M0 235 H420" stroke-width="11"/>
    <rect x="22" y="22" width="186" height="190" rx="18" fill="#d9ebe2" opacity=".82" stroke="none"/>
    <rect x="250" y="22" width="148" height="190" rx="18" fill="#f2dfc8" opacity=".82" stroke="none"/>
    <rect x="22" y="257" width="376" height="141" rx="18" fill="#d9e5f0" opacity=".82" stroke="none"/>
  </g>
  <g transform="translate(590 0)">
    <rect x="0" y="0" width="420" height="420" fill="url(#wall)" stroke-width="12"/>
    <path d="M285 0 V420 M0 235 H420" stroke-width="11"/>
    <rect x="22" y="22" width="241" height="190" rx="18" fill="#d9ebe2" opacity=".82" stroke="none"/>
    <rect x="305" y="22" width="93" height="190" rx="18" fill="#f2dfc8" opacity=".82" stroke="none"/>
    <rect x="22" y="257" width="376" height="141" rx="18" fill="#d9e5f0" opacity=".82" stroke="none"/>
  </g>
  <g transform="translate(462 180)" stroke="#a86a4c" stroke-width="7" fill="none">
    <path d="M0 30 H95"/><path d="M76 6 L104 30 L76 54"/>
  </g>
</g>
<g stroke="#8c9aa0" stroke-width="3" opacity=".65">
  <path d="M325 625 h90 M915 625 h90"/>
  <path d="M335 645 h70 M925 645 h70"/>
</g>

  </g>
</svg>