<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L04_M01_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Oila tarkibi va xonalar</text><text x="45" y="155" font-size="17" fill="#0E5558">Oilada ota-ona, ikki bola va tez-tez keladigan mehmonlar bor; uy rejasi kun tartibidan boshlanadi.</text><g transform="translate(0,80)"><rect x="80" y="220" width="230" height="57" fill="#0E5558" stroke="#0E5558" stroke-width="1"/><text x="90" y="256" font-size="19" fill="#FFFDF7">Foydalanuvchi</text><rect x="310" y="220" width="450" height="57" fill="#0E5558" stroke="#0E5558" stroke-width="1"/><text x="320" y="256" font-size="19" fill="#FFFDF7">Kundalik ehtiyoj</text><rect x="760" y="220" width="300" height="57" fill="#0E5558" stroke="#0E5558" stroke-width="1"/><text x="770" y="256" font-size="19" fill="#FFFDF7">Makon</text><rect x="80" y="277" width="230" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="313" font-size="19" fill="#203B36">Ota-ona</text><rect x="310" y="277" width="450" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="320" y="313" font-size="19" fill="#203B36">Uyqu / ish / saqlash</text><rect x="760" y="277" width="300" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="770" y="313" font-size="19" fill="#203B36">Tinch zona</text><rect x="80" y="334" width="230" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="370" font-size="19" fill="#203B36">Ikki bola</text><rect x="310" y="334" width="450" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="320" y="370" font-size="19" fill="#203B36">Uyqu / o‘qish / o‘yin</text><rect x="760" y="334" width="300" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="770" y="370" font-size="19" fill="#203B36">Bola xonasi</text><rect x="80" y="391" width="230" height="57" fill="#F1DFC6" stroke="#0E5558" stroke-width="1"/><text x="90" y="427" font-size="19" fill="#203B36">Mehmon</text><rect x="310" y="391" width="450" height="57" fill="#F1DFC6" stroke="#0E5558" stroke-width="1"/><text x="320" y="427" font-size="19" fill="#203B36">Suhbat / ovqatlanish</text><rect x="760" y="391" width="300" height="57" fill="#F1DFC6" stroke="#0E5558" stroke-width="1"/><text x="770" y="427" font-size="19" fill="#203B36">Umumiy zona</text><rect x="80" y="448" width="230" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="484" font-size="19" fill="#203B36">Oila</text><rect x="310" y="448" width="450" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="320" y="484" font-size="19" fill="#203B36">Dam / ovqat tayyorlash</text><rect x="760" y="448" width="300" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="770" y="484" font-size="19" fill="#203B36">Uy + hovli</text><rect x="80" y="505" width="230" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="541" font-size="19" fill="#203B36">Hammasi</text><rect x="310" y="505" width="450" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="320" y="541" font-size="19" fill="#203B36">Ertalab / mehmon vaqti</text><rect x="760" y="505" width="300" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="770" y="541" font-size="19" fill="#203B36">Yo‘llar sinovi</text><circle cx="150" cy="620" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="143" y="628" font-size="22" fill="#FFFDF7">3</text><text x="200" y="630" font-size="27" fill="#0E5558">Xona sonini kun tartibidan asoslang.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Har odam uchun uyqu, ish va saqlash ehtiyojini xona bilan bog‘lang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>