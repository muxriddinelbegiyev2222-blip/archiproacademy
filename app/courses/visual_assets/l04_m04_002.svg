<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L04_M04_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Ichki va tashqi makon o&#x27;tishi</text><text x="45" y="155" font-size="17" fill="#0E5558">Ayvon living bilan hovli orasida; stol va o‘tirish joyi uchun ishlatiladi.</text><g transform="translate(0,80)"><rect x="145" y="190" width="720" height="390" fill="#FFFDF7" stroke="#0E5558" stroke-width="8"/><line x1="420" y1="580" x2="510" y2="580" stroke="#FFFDF7" stroke-width="12"/><line x1="420" y1="575" x2="420" y2="485" stroke="#0E5558" stroke-width="3"/><path d="M510,575 A90,90 0 0,0 420,485" fill="none" stroke="#0E5558" stroke-width="2"/><line x1="330" y1="190" x2="475" y2="190" stroke="#D5E7ED" stroke-width="12"/><rect x="220" y="245" width="250" height="80" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><rect x="550" y="280" width="85" height="95" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><rect x="280" y="430" width="85" height="95" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><rect x="380" y="360" width="145" height="85" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="215" y="220" font-size="23" fill="#0E5558">DIVAN</text><text x="380" y="405" font-size="23" fill="#0E5558">STOL</text><line x1="500" y1="550" x2="735" y2="525" stroke="#A65D35" stroke-width="4"/><path d="M735, 525 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-6.0724564072077 735 525)"/><line x1="735" y1="525" x2="785" y2="255" stroke="#A65D35" stroke-width="4"/><path d="M785, 255 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-79.50852298766841 785 255)"/><circle cx="360" cy="350" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="353" y="358" font-size="22" fill="#FFFDF7">2</text><text x="387" y="358" font-size="21" fill="#0E5558">O‘tirish</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Living eshigi va stol orasidagi harakatni chizing</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>