<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L13_M01_001  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Birinchi suhbatning maqsadi</text><text x="45" y="155" font-size="17" fill="#0E5558">Mijoz “katta, chiroyli uy” dedi; foydalanish, budjet va vaqt hali aniqlanmagan.</text><g transform="translate(0,80)"><rect x="80" y="205" width="240" height="57" fill="#0E5558" stroke="#0E5558" stroke-width="1"/><text x="90" y="241" font-size="19" fill="#FFFDF7">Bo‘lim</text><rect x="320" y="205" width="440" height="57" fill="#0E5558" stroke="#0E5558" stroke-width="1"/><text x="330" y="241" font-size="19" fill="#FFFDF7">Namuna</text><rect x="760" y="205" width="305" height="57" fill="#0E5558" stroke="#0E5558" stroke-width="1"/><text x="770" y="241" font-size="19" fill="#FFFDF7">Keyingi ish</text><rect x="80" y="262" width="240" height="57" fill="#F1DFC6" stroke="#0E5558" stroke-width="1"/><text x="90" y="298" font-size="19" fill="#203B36">Uyqu</text><rect x="320" y="262" width="440" height="57" fill="#F1DFC6" stroke="#0E5558" stroke-width="1"/><text x="330" y="298" font-size="19" fill="#203B36">3 yotoqxona</text><rect x="760" y="262" width="305" height="57" fill="#F1DFC6" stroke="#0E5558" stroke-width="1"/><text x="770" y="298" font-size="19" fill="#203B36">Majburiy</text><rect x="80" y="319" width="240" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="355" font-size="19" fill="#203B36">Ish</text><rect x="320" y="319" width="440" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="330" y="355" font-size="19" fill="#203B36">Tinch ish joyi</text><rect x="760" y="319" width="305" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="770" y="355" font-size="19" fill="#203B36">Muhim</text><rect x="80" y="376" width="240" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="412" font-size="19" fill="#203B36">Mehmon</text><rect x="320" y="376" width="440" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="330" y="412" font-size="19" fill="#203B36">Ayvon / ovqatlanish</text><rect x="760" y="376" width="305" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="770" y="412" font-size="19" fill="#203B36">Variant</text><rect x="80" y="433" width="240" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="469" font-size="19" fill="#203B36">Chegara</text><rect x="320" y="433" width="440" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="330" y="469" font-size="19" fill="#203B36">Budjet / vaqt / site</text><rect x="760" y="433" width="305" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="770" y="469" font-size="19" fill="#203B36">Aniqlash</text><rect x="80" y="490" width="240" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="90" y="526" font-size="19" fill="#203B36">Tasdiq</text><rect x="320" y="490" width="440" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="330" y="526" font-size="19" fill="#203B36">Mijoz qarori</text><rect x="760" y="490" width="305" height="57" fill="#FFFDF7" stroke="#0E5558" stroke-width="1"/><text x="770" y="526" font-size="19" fill="#203B36">Qayd</text><circle cx="120" cy="625" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="113" y="633" font-size="22" fill="#FFFDF7">1</text><text x="170" y="635" font-size="26" fill="#0E5558">Qayd → dalil → qaror → qayta tekshiruv</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Suhbatdan olinadigan natijani belgilang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Ar