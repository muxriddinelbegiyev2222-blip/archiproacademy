<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L15_M03_001  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Plan xatolarini topish</text><text x="45" y="155" font-size="17" fill="#0E5558">Root cause case: scheduleda eski en, fasadda boshqa deraza, planda mebel eshikni to‘sadi.</text><g transform="translate(0,80)"><rect x="145" y="190" width="720" height="390" fill="#FFFDF7" stroke="#0E5558" stroke-width="8"/><line x1="420" y1="580" x2="510" y2="580" stroke="#FFFDF7" stroke-width="12"/><line x1="420" y1="575" x2="420" y2="485" stroke="#0E5558" stroke-width="3"/><path d="M510,575 A90,90 0 0,0 420,485" fill="none" stroke="#0E5558" stroke-width="2"/><line x1="330" y1="190" x2="475" y2="190" stroke="#D5E7ED" stroke-width="12"/><rect x="745" y="225" width="105" height="235" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><text x="640" y="495" font-size="22" fill="#0E5558">KIYIM / POYABZAL</text><line x1="500" y1="320" x2="500" y2="240" stroke="#0E5558" stroke-width="3"/><path d="M420,320 A80,80 0 0,1 500,240" fill="none" stroke="#0E5558" stroke-width="2"/><line x1="145" y1="320" x2="500" y2="320" stroke="#0E5558" stroke-width="5"/><line x1="580" y1="320" x2="865" y2="320" stroke="#0E5558" stroke-width="5"/><line x1="460" y1="545" x2="585" y2="420" stroke="#A65D35" stroke-width="4"/><path d="M585, 420 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-45.0 585 420)"/><line x1="585" y1="420" x2="585" y2="270" stroke="#A65D35" stroke-width="4"/><path d="M585, 270 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-90.0 585 270)"/><circle cx="435" cy="520" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="428" y="528" font-size="22" fill="#FFFDF7">1</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Yo‘l va mebelni chizing, simptomni sababga bog‘lang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>