<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L06_M06_005  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Roof professional audit</text><text x="45" y="155" font-size="17" fill="#0E5558">4 m keng o‘quv hajmda ikki qiyalikli tom. Yarim oraliq 2 m, qiyalik 30° uchun geometrik ko‘tarilish taxminan</text><text x="45" y="181" font-size="17" fill="#0E5558">1.155 m.</text><g transform="translate(0,80)"><polygon points="170,475 520,273 870,475" fill="#DBE9E2" stroke="#0E5558" stroke-width="5"/><line x1="170" y1="475" x2="870" y2="475" stroke="#0E5558" stroke-width="3"/><line x1="520" y1="273" x2="520" y2="475" stroke="#A65D35" stroke-width="3" stroke-dasharray="9 7"/><text x="250" y="520" font-size="25" fill="#0E5558">Yarim oraliq: 2 m</text><text x="550" y="375" font-size="25" fill="#A65D35">h ≈ 1,155 m</text><text x="170" y="670" font-size="29" fill="#A65D35">h = 2 × tan(30°) ≈ 1,155 m</text><text x="350" y="210" font-size="24" fill="#0E5558">Cho‘qqi</text><circle cx="350" cy="580" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="343" y="588" font-size="22" fill="#FFFDF7">5</text><text x="377" y="588" font-size="21" fill="#0E5558">Suv yo‘li</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Kontur, overhang, ridge va suv yo‘lini bir jadvalga yozing</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>