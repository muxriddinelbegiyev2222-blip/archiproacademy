<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L09_M04_001  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Tabiiy yorug&#x27;lik tushunchasi</text><text x="45" y="155" font-size="17" fill="#0E5558">Bir xonaning derazasi qo‘shni baland bino soyasida qolishi mumkin; plan va kesim birgalikda tekshiriladi.</text><g transform="translate(0,80)"><rect x="240" y="270" width="320" height="290" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><rect x="760" y="150" width="200" height="410" fill="#C9AD84" stroke="#0E5558" stroke-width="3"/><line x1="550" y1="300" x2="550" y2="420" stroke="#D5E7ED" stroke-width="10"/><line x1="760" y1="150" x2="555" y2="300" stroke="#A65D35" stroke-width="4"/><line x1="760" y1="150" x2="260" y2="540" stroke="#A65D35" stroke-width="3" stroke-dasharray="9 7"/><text x="210" y="610" font-size="27" fill="#0E5558">XONA</text><text x="770" y="610" font-size="23" fill="#0E5558">QO‘SHNI BINO</text><text x="185" y="690" font-size="23" fill="#A65D35">Joy / sana / orientatsiya / qo‘shni balandligi — hisob shartlari</text><circle cx="550" cy="255" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="543" y="263" font-size="22" fill="#FFFDF7">1</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Yoritish va to‘g‘ridan-to‘g‘ri quyosh tushishini ajrating</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>