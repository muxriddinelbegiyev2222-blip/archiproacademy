<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbf5e8"/><g font-family="DejaVu Sans,Segoe UI,sans-serif" fill="#243c38"><text x="70" y="72" font-size="22" fill="#a45e3b">L08_M04_004 · O‘QUV ESKIZI</text><text x="70" y="122" font-size="36" font-weight="700" fill="#0e5757">BALKON VA KONSOL — CHEKKA ZONANI ALOHIDA TEKSHIRING</text><rect x="220" y="360" width="760" height="100" fill="#dfe3dc" stroke="#334944" stroke-width="4"/><rect x="980" y="360" width="330" height="100" fill="#dfe3dc" stroke="#a45e3b" stroke-width="5"/><rect x="300" y="460" width="70" height="330" fill="#c7b18f" stroke="#334944" stroke-width="4"/><rect x="800" y="460" width="70" height="330" fill="#c7b18f" stroke="#334944" stroke-width="4"/><text x="1010" y="330" font-size="27" fill="#a45e3b">KONSOL ZONA</text><g stroke="#a45e3b" stroke-width="6"><line x1="1130" y1="270" x2="1130" y2="345"/></g><text x="245" y="855" font-size="22">Balkon cheti, tayanchdan chiqish va suv/issiqlik tugunlari alohida koordinatsiya talab qiladi.</text><text x="70" y="982" font-size="18" fill="#6c6a63">Eskiz konstruktiv konsol o‘lchamini tavsiya qilmaydi.</text></g></svg>