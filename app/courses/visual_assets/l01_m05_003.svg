<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L01_M05_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Hajmlarni birlashtirish</text><text x="45" y="155" font-size="17" fill="#0E5558">10×8×3 m asosiy hajmga 4×3 m ayvon qo‘shamiz. Har hajmni foydalanish vazifasi bilan bog‘laymiz.</text><g transform="translate(0,80)"><polygon points="200,360 600,360 600,540 200,540" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><polygon points="200,360 360,250 760,250 600,360" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><polygon points="600,360 760,250 760,430 600,540" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><text x="230" y="590" font-size="27" fill="#0E5558">Asosiy hajm: 10 × 8 × 3 m</text><polygon points="170,450 200,430 360,430 330,450" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><polygon points="170,450 330,450 330,540 170,540" fill="#EFD8B8" stroke="#203B36" stroke-width="3"/><circle cx="165" cy="415" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="158" y="423" font-size="22" fill="#FFFDF7">1</text><text x="192" y="423" font-size="21" fill="#0E5558">Ayvon: 4 × 3 m</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Ayvon hajmini kirish tomoniga qo‘shing, yopilish va ochiqlikni ajrating</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>