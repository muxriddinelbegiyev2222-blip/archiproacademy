"45" y="875" font-size="22" fill="#0E5558">Units va originni belgilang, 4000 mm nazorat masofasini qo‘ying</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>