<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L12_M06_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Sheet identity</text><text x="45" y="155" font-size="17" fill="#0E5558">Shtampda loyiha nomi, sheet ID, sheet title, sana va revision ko‘rsatiladi.</text><g transform="translate(0,80)"><rect x="120" y="190" width="920" height="460" fill="#FFFDF7" stroke="#0E5558" stroke-width="4"/><rect x="150" y="220" width="600" height="260" fill="none" stroke="#0E5558" stroke-width="2"/><rect x="590" y="530" width="425" height="85" fill="#FFFDF7" stroke="#0E5558" stroke-width="2"/><rect x="190" y="255" width="270" height="190" fill="#FFFDF7" stroke="#0E5558" stroke-width="4"/><line x1="325" y1="255" x2="325" y2="445" stroke="#0E5558" stroke-width="3"/><text x="500" y="315" font-size="25" fill="#0E5558">A-01 · PLAN</text><text x="610" y="565" font-size="19" fill="#0E5558">LOYIHA / VARAQ / SANA</text><text x="610" y="605" font-size="20" fill="#A65D35">ID: A-01    REVISION: R02</text><rect x="580" y="520" width="445" height="105" fill="none" stroke="#A65D35" stroke-width="5"/><text x="165" y="700" font-size="25" fill="#0E5558">View → Drawing → Layout → haqiqiy chiqarilgan fayl</text><circle cx="600" cy="640" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="593" y="648" font-size="22" fill="#FFFDF7">2</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">A-01 va A-02 uchun ID/nomni moslashtiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>