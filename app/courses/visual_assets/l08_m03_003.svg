<text x="625" y="860" font-size="26">4000 mm — O‘QUV MISOLI</text><text x="1190" y="540" font-size="26" transform="rotate(90 1190 540)">3000 mm — O‘QUV MISOLI</text><text x="310" y="925" font-size="22">Bu o‘lchamlar konstruktiv tavsiya emas; grid va span tushunchasini o‘rganish uchun misol.</text><text x="70" y="984" font-size="18" fill="#6c6a63">Real oraliqlar hisob, material va loyiha talablariga bog‘liq.</text></g></svg>