<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A65D35"/></marker></defs><rect width="1000" height="650" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="40" y="55" font-size="30" fill="#0E5558">Masshtab: model va qog‘ozdagi uzunlik</text><line x1="140" y1="270" x2="840" y2="270" stroke="#0E5558" stroke-width="7" /><line x1="140" y1="245" x2="140" y2="295" stroke="#203B36" stroke-width="4" /><line x1="840" y1="245" x2="840" y2="295" stroke="#203B36" stroke-width="4" /><text x="310" y="230" font-size="26" fill="#203B36">Haqiqiy uzunlik: 4 000 mm</text><text x="145" y="390" font-size="32" fill="#A65D35">1:100 → 4 000 ÷ 100 = 40 mm</text><text x="145" y="455" font-size="24" fill="#203B36">Modelda: 4 000 mm. Qog‘ozda: 40 mm.</text><text x="40" y="625" font-size="17" fill="#0E5558">O‘quv sxemasi. O‘lcham va konstruktiv yechim loyiha talabi emas.</text></g></svg>