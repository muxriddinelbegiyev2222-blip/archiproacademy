<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A65D35"/></marker></defs><rect width="1000" height="650" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="40" y="55" font-size="30" fill="#0E5558">Planda eshik va deraza belgisi</text><rect x="100" y="250" width="350" height="30" fill="#EAE4D6" stroke="#203B36" stroke-width="4"/><rect x="550" y="250" width="350" height="30" fill="#EAE4D6" stroke="#203B36" stroke-width="4"/><rect x="230" y="245" width="95" height="40" fill="#FFFDF7" stroke="#FFFDF7" stroke-width="4"/><line x1="230" y1="250" x2="230" y2="155" stroke="#0E5558" stroke-width="4" /><path d="M325,250 A95,95 0 0,0 230,155" stroke="#0E5558" fill="none" stroke-width="3"/><rect x="675" y="250" width="105" height="30" fill="#DBE9E8" stroke="#203B36" stroke-width="4"/><line x1="675" y1="265" x2="780" y2="265" stroke="#0E5558" stroke-width="2" /><text x="130" y="400" font-size="23" fill="#203B36">Eshik: tabaqa va ochilish yoyi</text><text x="560" y="400" font-size="23" fill="#203B36">Deraza: devordagi ochilish</text><text x="110" y="490" font-size="23" fill="#203B36">Ochilish yo‘nalishi bino turi va talablar bilan tekshiriladi.</text><text x="40" y="625" font-size="17" fill="#0E5558">O‘quv sxemasi. O‘lcham va konstruktiv yechim loyiha talabi emas.</text></g></svg>