<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L10_M11_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Plan, fasad va kesimlar</text><text x="45" y="155" font-size="17" fill="#0E5558">Albomi A-01 genplan, A-02 plan, A-03 fasad, A-04 kesim va A-05 izoh/tekshiruvdan iborat o‘quv paket.</text><g transform="translate(0,80)"><rect x="75" y="250" width="180" height="320" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="90" y="300" font-size="25" fill="#0E5558">A-01</text><text x="85" y="380" font-size="21" fill="#0E5558">GENPLAN</text><line x1="95" y1="445" x2="235" y2="445" stroke="#0E5558" stroke-width="2"/><line x1="95" y1="470" x2="215" y2="470" stroke="#0E5558" stroke-width="2"/><rect x="285" y="250" width="180" height="320" fill="#F1DFC6" stroke="#0E5558" stroke-width="3"/><text x="300" y="300" font-size="25" fill="#0E5558">A-02</text><text x="295" y="380" font-size="21" fill="#0E5558">PLAN</text><line x1="305" y1="445" x2="445" y2="445" stroke="#0E5558" stroke-width="2"/><line x1="305" y1="470" x2="425" y2="470" stroke="#0E5558" stroke-width="2"/><rect x="495" y="250" width="180" height="320" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="510" y="300" font-size="25" fill="#0E5558">A-03</text><text x="505" y="380" font-size="21" fill="#0E5558">FASAD</text><line x1="515" y1="445" x2="655" y2="445" stroke="#0E5558" stroke-width="2"/><line x1="515" y1="470" x2="635" y2="470" stroke="#0E5558" stroke-width="2"/><rect x="705" y="250" width="180" height="320" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="720" y="300" font-size="25" fill="#0E5558">A-04</text><text x="715" y="380" font-size="21" fill="#0E5558">KESIM</text><line x1="725" y1="445" x2="865" y2="445" stroke="#0E5558" stroke-width="2"/><line x1="725" y1="470" x2="845" y2="470" stroke="#0E5558" stroke-width="2"/><rect x="915" y="250" width="180" height="320" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="930" y="300" font-size="25" fill="#0E5558">A-05</text><text x="925" y="380" font-size="21" fill="#0E5558">IZOH</text><line x1="935" y1="445" x2="1075" y2="445" stroke="#0E5558" stroke-width="2"/><line x1="935" y1="470" x2="1055" y2="470" stroke="#0E5558" stroke-width="2"/><text x="150" y="665" font-size="25" fill="#0E5558">Loyiha albomi: har varaqning vazifasi va manbasi aniq.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Plan, fasad va kesimni bir xil model revisionidan tayyorlang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>