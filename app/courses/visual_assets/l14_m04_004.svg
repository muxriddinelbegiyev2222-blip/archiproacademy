<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L14_M04_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Massing, courtyard va landscape</text><text x="45" y="155" font-size="17" fill="#0E5558">Villa dasturida oila, mehmon, ish, xizmat va tashqi dam olish klasterlari bor.</text><g transform="translate(0,80)"><polygon points="200,360 600,360 600,540 200,540" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><polygon points="200,360 360,250 760,250 600,360" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><polygon points="600,360 760,250 760,430 600,540" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><text x="230" y="590" font-size="27" fill="#0E5558">Asosiy hajm: 10 × 8 × 3 m</text><polygon points="410,335 495,278 610,278 525,335" fill="#FFFDF7" stroke="#A65D35" stroke-width="3"/><line x1="460" y1="180" x2="485" y2="315" stroke="#A65D35" stroke-width="4"/><path d="M485, 315 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(79.50852298766841 485 315)"/><text x="460" y="165" font-size="25" fill="#A65D35">Hovli bo‘shlig‘i</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Hajm, hovli va landshaftni shu aloqadan hosil qiling</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>