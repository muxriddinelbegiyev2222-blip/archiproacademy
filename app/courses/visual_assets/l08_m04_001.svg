<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbf5e8"/><g font-family="DejaVu Sans,Segoe UI,sans-serif" fill="#243c38"><text x="70" y="72" font-size="22" fill="#a45e3b">L08_M04_001 · O‘QUV ESKIZI</text><text x="70" y="122" font-size="36" font-weight="700" fill="#0e5757">PLITA — POL QATLAMI EMAS, YUK UZATUVCHI ELEMENT</text><rect x="180" y="300" width="1170" height="90" fill="#d8ded8" stroke="#334944" stroke-width="4"/><rect x="260" y="390" width="70" height="350" fill="#d4c3aa" stroke="#334944" stroke-width="4"/><rect x="1200" y="390" width="70" height="350" fill="#d4c3aa" stroke="#334944" stroke-width="4"/><g stroke="#a45e3b" stroke-width="7"><line x1="760" y1="220" x2="760" y2="285"/><line x1="295" y1="420" x2="295" y2="720"/><line x1="1235" y1="420" x2="1235" y2="720"/></g><text x="210" y="825" font-size="26">YOPMA → TAYANCHLAR → PASTKI TIZIM</text><rect x="180" y="860" width="1170" height="70" rx="14" fill="#fffdf8" stroke="#b9aa90" stroke-width="2"/><text x="215" y="905" font-size="22">Pardoz qatlamini konstruktiv plita bilan aralashtirmang.</text><text x="70" y="982" font-size="18" fill="#6c6a63">Konseptual konstruktiv mantiq; plita qalinligi va armatura hisob bilan aniqlanadi.</text></g></svg>