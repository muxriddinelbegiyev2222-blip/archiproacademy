<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L05_M08_005  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">2D grafik mini-loyiha</text><text x="45" y="155" font-size="17" fill="#0E5558">4000×3000 mm sxemaga zonalash filli, xona nomi va elementga bog‘langan label qo‘shiladi.</text><g transform="translate(0,80)"><rect x="200" y="245" width="580" height="320" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="270" y="355" font-size="29" fill="#0E5558">YOTOQXONA</text><text x="270" y="405" font-size="23" fill="#0E5558">Text: mustaqil yozuv</text><line x1="965" y1="490" x2="800" y2="490" stroke="#A65D35" stroke-width="4"/><path d="M800, 490 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(180.0 800 490)"/><text x="800" y="430" font-size="26" fill="#A65D35">Label</text><text x="800" y="465" font-size="21" fill="#A65D35">Elementga</text><text x="800" y="510" font-size="21" fill="#A65D35">bog‘langan</text><text x="220" y="650" font-size="24" fill="#0E5558">Fill — 2D belgi. Text va Labelning manbasi farq qiladi.</text><circle cx="745" cy="590" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="738" y="598" font-size="22" fill="#FFFDF7">5</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Text va Labelni solishtiring, element o‘zgarganda qaysi biri yangilanishini ko‘ring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>