<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L02_M03_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Asosiy va ikkilamchi harakat yo&#x27;llari</text><text x="45" y="155" font-size="17" fill="#0E5558">Kirish→mehmonxona yo‘li 6 m, oshxona→dining yo‘li 3 m. Ikkita eshik bir burchakda ochiladi.</text><g transform="translate(0,80)"><rect x="130" y="235" width="360" height="220" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="690" y="235" width="330" height="220" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><rect x="130" y="510" width="360" height="110" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><rect x="690" y="510" width="330" height="110" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="165" y="310" font-size="25" fill="#0E5558">MEHMONXONA</text><text x="730" y="310" font-size="25" fill="#0E5558">OSHXONA</text><text x="180" y="575" font-size="25" fill="#0E5558">KIRISH</text><text x="730" y="575" font-size="24" fill="#0E5558">OVQATLANISH</text><line x1="330" y1="525" x2="330" y2="410" stroke="#A65D35" stroke-width="4"/><path d="M330, 410 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-90.0 330 410)"/><line x1="865" y1="410" x2="865" y2="510" stroke="#A65D35" stroke-width="4"/><path d="M865, 510 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(90.0 865 510)"/><text x="375" y="490" font-size="23" fill="#A65D35">6 m yo‘l</text><text x="885" y="485" font-size="23" fill="#A65D35">3 m yo‘l</text><text x="190" y="700" font-size="23" fill="#0E5558">Yo‘l uzunligi o‘quv sharti; bu sxema masshtabli plan emas.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Ko‘p ishlatiladigan yo‘lni asosiy deb belgilang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>