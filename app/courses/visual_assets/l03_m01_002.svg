<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L03_M01_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Uchastka shakli va proporsiyasi</text><text x="45" y="155" font-size="17" fill="#0E5558">20×30 m uchastka qisqa tomoni bilan ko‘chaga tutashadi; daraxt va eski yordamchi bino mavjud.</text><g transform="translate(0,80)"><rect x="160" y="170" width="670" height="425" fill="#DBE9E2" stroke="#0E5558" stroke-width="4"/><rect x="160" y="610" width="670" height="45" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><text x="230" y="643" font-size="23" fill="#0E5558">KO‘CHA</text><line x1="90" y1="280" x2="90" y2="195" stroke="#0E5558" stroke-width="4"/><path d="M90, 195 l-12,-5 l0,10 Z" fill="#0E5558" transform="rotate(-90.0 90 195)"/><text x="50" y="165" font-size="21" fill="#0E5558">SHIMOL</text><rect x="210" y="230" width="570" height="175" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><text x="240" y="325" font-size="22" fill="#0E5558">UY / ASOSIY HAJM</text><text x="535.0" y="495" font-size="24" fill="#0E5558">HOVLI</text><line x1="495.0" y1="600" x2="495.0" y2="440" stroke="#A65D35" stroke-width="4"/><path d="M495.0, 440 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-90.0 495.0 440)"/><text x="515.0" y="575" font-size="20" fill="#0E5558">Kirish</text><circle cx="780" cy="480" r="30" fill="#A9C99A" stroke="#0E5558" stroke-width="3"/><text x="685" y="450" font-size="20" fill="#0E5558">Daraxt</text><rect x="185" y="460" width="125" height="115" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="195" y="525" font-size="19" fill="#0E5558">PARKING</text><line x1="225" y1="610" x2="225" y2="560" stroke="#A65D35" stroke-width="4"/><path d="M225, 560 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-90.0 225 560)"/><line x1="340" y1="600" x2="340" y2="440" stroke="#0E5558" stroke-width="4"/><path d="M340, 440 l-12,-5 l0,10 Z" fill="#0E5558" transform="rotate(-90.0 340 440)"/><circle cx="340" cy="540" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="333" y="548" font-size="22" fill="#FFFDF7">2</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">20/30 nisbatni solishtiring, uy uchun cheklovlarni ajrating</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>