<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L05_M03_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Devor geometriyasi</text><text x="45" y="155" font-size="17" fill="#0E5558">4000×3000 mm ichki xona, 200 mm devor qalinligi va 3000 mm o‘quv balandligi bilan yopiq kontur tuzamiz.</text><text x="45" y="181" font-size="17" fill="#0E5558">Qiymatlar loyiha normativi emas.</text><g transform="translate(0,80)"><rect x="190" y="190" width="660" height="510" fill="#C9AD84" stroke="#0E5558" stroke-width="4"/><rect x="220" y="220" width="600" height="450" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><line x1="220" y1="180" x2="820" y2="180" stroke="#0E5558" stroke-width="2"/><line x1="220" y1="172" x2="220" y2="188" stroke="#0E5558" stroke-width="2"/><line x1="820" y1="172" x2="820" y2="188" stroke="#0E5558" stroke-width="2"/><text x="478.0" y="168" font-size="21" fill="#0E5558">4 000 mm ichki</text><line x1="190" y1="745" x2="850" y2="745" stroke="#0E5558" stroke-width="2"/><line x1="190" y1="737" x2="190" y2="753" stroke="#0E5558" stroke-width="2"/><line x1="850" y1="737" x2="850" y2="753" stroke="#0E5558" stroke-width="2"/><text x="478.0" y="733" font-size="21" fill="#0E5558">4 400 mm tashqi</text><text x="50" y="465" font-size="21" fill="#0E5558">3 000 mm</text><text x="870" y="465" font-size="21" fill="#0E5558">3 400 mm</text><text x="340" y="390" font-size="27" fill="#0E5558">ICHKI XONA: 12 m²</text><text x="355" y="460" font-size="25" fill="#A65D35">DEVOR: 200 mm</text><circle cx="190" cy="190" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="183" y="198" font-size="22" fill="#FFFDF7">3</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">To‘rtta segmentni 4000, 3000, 4000, 3000 mm bilan yopiq konturga chizing. Burchakda</text><text x="45" y="906" font-size="22" fill="#0E5558">reference line mantiqini saqlang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>