<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L05_M09_005  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Dimension mini-loyiha</text><text x="45" y="155" font-size="17" fill="#0E5558">Uch ketma-ket masofa 4000, 3000 va 2000 mm; umumiy uzunlik 9000 mm.</text><g transform="translate(0,80)"><line x1="150" y1="260" x2="150" y2="480" stroke="#0E5558" stroke-width="4"/><line x1="550" y1="260" x2="550" y2="480" stroke="#0E5558" stroke-width="4"/><line x1="850" y1="260" x2="850" y2="480" stroke="#0E5558" stroke-width="4"/><line x1="1050" y1="260" x2="1050" y2="480" stroke="#0E5558" stroke-width="4"/><line x1="150" y1="350" x2="550" y2="350" stroke="#0E5558" stroke-width="2"/><line x1="150" y1="342" x2="150" y2="358" stroke="#0E5558" stroke-width="2"/><line x1="550" y1="342" x2="550" y2="358" stroke="#0E5558" stroke-width="2"/><text x="308.0" y="338" font-size="21" fill="#0E5558">4 000</text><line x1="550" y1="350" x2="850" y2="350" stroke="#0E5558" stroke-width="2"/><line x1="550" y1="342" x2="550" y2="358" stroke="#0E5558" stroke-width="2"/><line x1="850" y1="342" x2="850" y2="358" stroke="#0E5558" stroke-width="2"/><text x="658.0" y="338" font-size="21" fill="#0E5558">3 000</text><line x1="850" y1="350" x2="1050" y2="350" stroke="#0E5558" stroke-width="2"/><line x1="850" y1="342" x2="850" y2="358" stroke="#0E5558" stroke-width="2"/><line x1="1050" y1="342" x2="1050" y2="358" stroke="#0E5558" stroke-width="2"/><text x="908.0" y="338" font-size="21" fill="#0E5558">2 000</text><line x1="150" y1="540" x2="1050" y2="540" stroke="#0E5558" stroke-width="2"/><line x1="150" y1="532" x2="150" y2="548" stroke="#0E5558" stroke-width="2"/><line x1="1050" y1="532" x2="1050" y2="548" stroke="#0E5558" stroke-width="2"/><text x="558.0" y="528" font-size="21" fill="#0E5558">9 000 mm</text><text x="230" y="650" font-size="28" fill="#A65D35">4 000 + 3 000 + 2 000 = 9 000 mm</text><circle cx="1050" cy="225" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="1043" y="233" font-size="22" fill="#FFFDF7">5</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Bir nuqtani 500 mm suring va o‘lchamlarni tekshiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>