<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L06_M03_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Intersection Priority va model tutashuvi</text><text x="45" y="155" font-size="17" fill="#0E5558">Bir devorning ichki materiali va tashqi yuzasi boshqacha; kesim va 3D ko‘rinishini solishtiramiz.</text><g transform="translate(0,80)"><rect x="220" y="250" width="420" height="240" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><rect x="640" y="250" width="25" height="240" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><text x="240" y="230" font-size="27" fill="#0E5558">Building Material</text><text x="675" y="375" font-size="26" fill="#A65D35">Surface</text><line x1="845" y1="400" x2="675" y2="400" stroke="#A65D35" stroke-width="4"/><path d="M675, 400 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(180.0 675 400)"/><text x="210" y="600" font-size="29" fill="#0E5558">Ichki tarkib ≠ tashqi yuzadagi rang</text><circle cx="490" cy="520" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="483" y="528" font-size="22" fill="#FFFDF7">4</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Tutashuvdagi material va intersection priorityni o‘qing</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>