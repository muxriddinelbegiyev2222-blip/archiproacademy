<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L05_M10_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Door, Window va mebel</text><text x="45" y="155" font-size="17" fill="#0E5558">Birinchi mini-model: 4×3 m ichki xona, 200 mm devor, o‘quv slab, bitta eshik va deraza.</text><g transform="translate(0,80)"><rect x="200" y="250" width="680" height="290" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="295" y="355" width="95" height="185" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><rect x="580" y="310" width="130" height="150" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="205" y="605" font-size="25" fill="#0E5558">D01: 900 × 2 100 mm</text><text x="555" y="605" font-size="25" fill="#0E5558">W01: 1 200 × 1 500 mm</text><text x="440" y="675" font-size="24" fill="#A65D35">Sill 900 + bo‘y 1 500 = yuqori sath 2 400 mm</text><circle cx="710" cy="285" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="703" y="293" font-size="22" fill="#FFFDF7">3</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Eshik, deraza va o‘lchamli mebelni qo‘shing, ochilish yoyini ko‘ring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>