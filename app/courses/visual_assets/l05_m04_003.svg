<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L05_M04_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Slab konturini yaratish</text><text x="45" y="155" font-size="17" fill="#0E5558">4000×3000 mm to‘rtburchak slabni o‘quv qalinligi 200 mm bilan chizamiz; keyin 1000×1000 mm teshikni ko‘rsatamiz.</text><g transform="translate(0,80)"><rect x="185" y="230" width="640" height="480" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="475" y="345" width="160" height="160" fill="#FFFDF7" stroke="#A65D35" stroke-width="3"/><text x="490" y="410" font-size="22" fill="#A65D35">TESHIK</text><text x="235" y="195" font-size="27" fill="#0E5558">Kontur: 4 × 3 = 12 m²</text><text x="160" y="690" font-size="23" fill="#0E5558">12 − 1 = 11 m² geometrik maydon; qoidani alohida belgilang.</text><circle cx="475" cy="315" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="468" y="323" font-size="22" fill="#FFFDF7">3</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Burchaklarni modeldagi tayanch konturga bog‘lang, yopiq poligonni yakunlang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>