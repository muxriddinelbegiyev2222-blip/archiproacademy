<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L01_M04_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Asimmetriya nima?</text><text x="45" y="155" font-size="17" fill="#0E5558">12 m fasadning simmetriya o‘qi x=6 m. Deraza markazlari x=3 va x=9 m.</text><g transform="translate(0,80)"><rect x="140" y="310" width="800" height="210" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><line x1="110" y1="520" x2="990" y2="520" stroke="#0E5558" stroke-width="5"/><line x1="540" y1="170" x2="540" y2="550" stroke="#A65D35" stroke-width="3" stroke-dasharray="9 7"/><text x="570" y="195" font-size="22" fill="#A65D35">O‘Q: x = 6 m</text><rect x="220" y="385" width="60" height="135" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><circle cx="250" cy="685" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="243" y="693" font-size="22" fill="#FFFDF7">1</text><text x="277" y="693" font-size="21" fill="#0E5558">Kirish chetda</text><rect x="306.0" y="355" width="68" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="340" y1="355" x2="340" y2="450" stroke="#0E5558" stroke-width="2"/><rect x="706.0" y="355" width="68" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="740" y1="355" x2="740" y2="450" stroke="#0E5558" stroke-width="2"/><line x1="340" y1="580" x2="540" y2="580" stroke="#0E5558" stroke-width="2"/><line x1="340" y1="572" x2="340" y2="588" stroke="#0E5558" stroke-width="2"/><line x1="540" y1="572" x2="540" y2="588" stroke="#0E5558" stroke-width="2"/><text x="398.0" y="568" font-size="21" fill="#0E5558">3 m</text><line x1="540" y1="580" x2="740" y2="580" stroke="#0E5558" stroke-width="2"/><line x1="540" y1="572" x2="540" y2="588" stroke="#0E5558" stroke-width="2"/><line x1="740" y1="572" x2="740" y2="588" stroke="#0E5558" stroke-width="2"/><text x="598.0" y="568" font-size="21" fill="#0E5558">3 m</text><text x="280" y="630" font-size="26" fill="#A65D35">6 − 3 = 3          9 − 6 = 3</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Kirishni x=2 m ga ko‘chiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>