<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L13_M05_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Plan va diagrammani tushuntirish</text><text x="45" y="155" font-size="17" fill="#0E5558">10 daqiqalik taqdimot: brief, site, konsepsiya, plan, fasad va ochiq savollar.</text><g transform="translate(0,80)"><rect x="130" y="205" width="865" height="355" fill="#FFFDF7" stroke="#0E5558" stroke-width="5"/><rect x="160" y="235" width="445" height="270" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="650" y="255" width="305" height="65" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="675" y="298" font-size="22" fill="#0E5558">EHTIYOJ → QAROR</text><text x="675" y="375" font-size="25" fill="#0E5558">Chizma — dalil</text><text x="675" y="435" font-size="23" fill="#A65D35">Ochiq savol — qayd</text><line x1="195" y1="460" x2="380" y2="285" stroke="#0E5558" stroke-width="5"/><line x1="380" y1="285" x2="565" y2="460" stroke="#0E5558" stroke-width="5"/><circle cx="335" cy="625" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="328" y="633" font-size="22" fill="#FFFDF7">2</text><text x="135" y="690" font-size="23" fill="#0E5558">Uch asosiy qarorni ko‘rsating; xonalar ro‘yxatini o‘qib bermang.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Planda uch asosiy yo‘lni ko‘rsating, xona ro‘yxatini o‘qish bilan cheklanmang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>