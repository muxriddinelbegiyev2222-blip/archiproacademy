<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L11_M01_005  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">2 qavatli konsepsiya auditi</text><text x="45" y="155" font-size="17" fill="#0E5558">Pastki qavatda umumiy, yuqorida tinch xonalar; zinapoya ikki qavatni bog‘laydi.</text><g transform="translate(0,80)"><rect x="230" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="795" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="230" y="365" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="230" y="555" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><line x1="230" y1="220" x2="535" y2="130" stroke="#0E5558" stroke-width="6"/><line x1="535" y1="130" x2="840" y2="220" stroke="#0E5558" stroke-width="6"/><text x="855" y="378" font-size="22" fill="#0E5558">+3.000</text><text x="855" y="580" font-size="22" fill="#0E5558">±0.000</text><text x="350" y="310" font-size="25" fill="#0E5558">1-QAVAT: TINCH ZONA</text><text x="350" y="500" font-size="25" fill="#0E5558">0-QAVAT: UMUMIY ZONA</text><line x1="420" y1="530" x2="670" y2="405" stroke="#A65D35" stroke-width="4"/><path d="M670, 405 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-26.56505117707799 670 405)"/><line x1="670" y1="405" x2="750" y2="305" stroke="#A65D35" stroke-width="4"/><path d="M750, 305 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-51.34019174590991 750 305)"/><text x="350" y="640" font-size="27" fill="#A65D35">Sathlar farqi: 3 000 mm</text><circle cx="600" cy="230" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="593" y="238" font-size="22" fill="#FFFDF7">5</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke