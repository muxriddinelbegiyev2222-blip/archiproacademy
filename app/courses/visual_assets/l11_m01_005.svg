<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbf5e8"/><g font-family="DejaVu Sans,Segoe UI,sans-serif" fill="#243c38"><text x="70" y="72" font-size="22" fill="#a45e3b">L11_M01_005 · O‘QUV ESKIZI</text><text x="70" y="122" font-size="36" font-weight="700" fill="#0e5757">2 QAVATLI KONSEPSIYA AUDITI</text><g fill="#fffdf8" stroke="#b9aa90" stroke-width="2"><rect x="115" y="225" width="300" height="470" rx="16"/><rect x="485" y="225" width="300" height="470" rx="16"/><rect x="855" y="225" width="300" height="470" rx="16"/><rect x="1225" y="225" width="200" height="470" rx="16"/></g><text x="150" y="280" font-size="24" font-weight="700">QAVAT ROLI</text><text x="520" y="280" font-size="24" font-weight="700">YADRO</text><text x="890" y="280" font-size="24" font-weight="700">STACK / TAYANCH</text><text x="1250" y="280" font-size="24" font-weight="700">FASAD</text><text x="150" y="360" font-size="20">public / private</text><text x="520" y="360" font-size="20">zina / shaft</text><text x="890" y="360" font-size="20">wet-zone / devor</text><text x="1250" y="360" font-size="20">hajm / ritm</text><path d="M270 420 H1320" stroke="#0e5757" stroke-width="4" stroke-dasharray="12 10"/><text x="245" y="820" font-size="23">Brief → qavat funksiyasi → vertikal yadro → texnik moslik → massing/fasad → audit</text><text x="360" y="870" font-size="21">Har qaror ikki qavat bo‘yicha ishlashini tekshiring, faqat alohida plan sifatida emas.</text><text x="70" y="982" font-size="18" fill="#6c6a63">Konseptual audit sxemasi; konstruktiv va MEP tasdiqlari tegishli mutaxassislar bilan tekshiriladi.</text></g></svg>