<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L05_M08_001  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Line va Polyline</text><text x="45" y="155" font-size="17" fill="#0E5558">4000×3000 mm sxemaga zonalash filli, xona nomi va elementga bog‘langan label qo‘shiladi.</text><g transform="translate(0,80)"><line x1="165" y1="325" x2="415" y2="325" stroke="#0E5558" stroke-width="5"/><line x1="615" y1="325" x2="830" y2="325" stroke="#A65D35" stroke-width="5"/><line x1="830" y1="325" x2="830" y2="500" stroke="#A65D35" stroke-width="5"/><line x1="830" y1="500" x2="650" y2="500" stroke="#A65D35" stroke-width="5"/><text x="180" y="255" font-size="26" fill="#0E5558">LINE: BIR SEGMENT</text><text x="605" y="255" font-size="25" fill="#A65D35">POLYLINE: BOG‘LANGAN</text><text x="210" y="650" font-size="25" fill="#0E5558">Bitta chiziq va ketma-ket kontur geometriyasini ajrating.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Line bilan bitta segment, Polyline bilan bog‘langan kontur chizing</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>