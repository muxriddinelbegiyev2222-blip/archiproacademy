    <rect x="424" y="479" width="242" height="82" rx="18" fill="#d8e5d4"/>
  </g>
  <g stroke-width="3" opacity=".72">
    <rect x="130" y="145" width="160" height="70" rx="18" fill="#d2b58b"/><rect x="130" y="235" width="95" height="35" fill="#d2b58b"/>
    <rect x="170" y="405" width="170" height="65" rx="15" fill="#d2b58b"/><rect x="390" y="395" width="150" height="70" rx="10" fill="#dcc49c"/>
