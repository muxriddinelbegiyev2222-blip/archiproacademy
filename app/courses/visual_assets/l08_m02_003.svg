<rect x="530" y="365" width="460" height="55" fill="#c9ad84" stroke="#334944" stroke-width="3"/><text x="610" y="400" font-size="24">OCHILISH USTIDAGI ZONA</text>
<text x="585" y="835" font-size="28" font-weight="700" fill="#a45e3b">KATTA OCHILISH = QAYTA KOORDINATSIYA SAVOLI</text>
<text x="225" y="890" font-size="22">Eshik, vitraj yoki MEP teshigi konstruktiv devorda paydo bo‘lsa, tayanch va yuk uzatish yo‘li tekshiriladi.</text><text x="70" y="984" font-size="18" fill="#6c6a63">Eskiz yechim bermaydi; ochilish usti elementi va o‘lchami hisob bilan aniqlanadi.</text></g></svg>