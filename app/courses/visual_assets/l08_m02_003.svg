<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbf5e8"/><g font-family="DejaVu Sans,Segoe UI,sans-serif" fill="#243c38"><text x="70" y="74" font-size="22" fill="#a45e3b">L08_M02_003 · O‘QUV ESKIZI</text><text x="70" y="122" font-size="38" font-weight="700" fill="#0e5757">OCHILISH YUK YO‘LINI QAYERDA UZADI?</text>
<rect x="220" y="255" width="1090" height="530" fill="#eadfce" stroke="#334944" stroke-width="4"/><rect x="565" y="430" width="395" height="355" fill="#fbf5e8" stroke="#334944" stroke-width="4"/>
