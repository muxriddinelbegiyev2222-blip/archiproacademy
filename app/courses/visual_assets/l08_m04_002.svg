<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L08_M04_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Plita tayanch sxemasi</text><text x="45" y="155" font-size="17" fill="#0E5558">Yopmada zinapoya teshigi va balkon chiqishi bor; tayanchlarni kesimda tekshiramiz.</text><g transform="translate(0,80)"><rect x="230" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="795" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="230" y="365" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="230" y="555" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><line x1="230" y1="220" x2="535" y2="130" stroke="#0E5558" stroke-width="6"/><line x1="535" y1="130" x2="840" y2="220" stroke="#0E5558" stroke-width="6"/><text x="855" y="378" font-size="22" fill="#0E5558">+3.000</text><text x="855" y="580" font-size="22" fill="#0E5558">±0.000</text><line x1="410" y1="377" x2="635" y2="377" stroke="#FFFDF7" stroke-width="35"/><text x="435" y="335" font-size="24" fill="#A65D35">BO‘SHLIQ</text><line x1="520" y1="505" x2="520" y2="405" stroke="#A65D35" stroke-width="4"/><path d="M520, 405 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-90.0 520 405)"/><text x="360" y="640" font-size="23" fill="#0E5558">Teshik va tayanch — plan/kesim koordinatsiyasi.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Tayanch devor/rigellarni yopma konturi bilan solishtiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>