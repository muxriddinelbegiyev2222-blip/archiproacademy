<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbf5e8"/><g font-family="DejaVu Sans,Segoe UI,sans-serif" fill="#243c38"><text x="70" y="72" font-size="22" fill="#a45e3b">L08_M04_002 · O‘QUV ESKIZI</text><text x="70" y="122" font-size="36" font-weight="700" fill="#0e5757">PLITA QAYSI TAYANCHLARGA ISHLAYDI?</text><rect x="240" y="260" width="1050" height="520" fill="#dfe3dc" stroke="#334944" stroke-width="4"/><rect x="280" y="310" width="65" height="420" fill="#c7b18f"/><rect x="1185" y="310" width="65" height="420" fill="#c7b18f"/><rect x="610" y="310" width="65" height="420" fill="#b9cfd0"/><g stroke="#a45e3b" stroke-width="5"><line x1="500" y1="500" x2="335" y2="500"/><line x1="780" y1="500" x2="640" y2="500"/><line x1="920" y1="500" x2="1210" y2="500"/></g><text x="255" y="835" font-size="24">TAYANCH DEVOR / RIGEL / USTUN SxEMASI BIRGALIKDA TEKSHIRILADI</text><text x="255" y="885" font-size="21">Plita konturi yolg‘iz o‘zi yuk yo‘lini isbotlamaydi.</text><text x="70" y="982" font-size="18" fill="#6c6a63">O‘quv sxemasi; haqiqiy tayanch yo‘nalishi konstruktor modeli bilan tekshiriladi.</text></g></svg>