<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbf5e8"/><g font-family="DejaVu Sans,Segoe UI,sans-serif" fill="#243c38"><text x="70" y="72" font-size="22" fill="#a45e3b">L11_M01_004 · O‘QUV ESKIZI</text><text x="70" y="122" font-size="36" font-weight="700" fill="#0e5757">MASSING VA FASADNI QAVATLAR LOGIKASI BILAN BOG‘LANG</text><path d="M220 770 L220 420 L540 420 L540 300 L980 300 L980 770 Z" fill="#eee4d7" stroke="#334944" stroke-width="4"/><rect x="300" y="500" width="130" height="170" fill="#cfe2e6" stroke="#334944" stroke-width="3"/><rect x="650" y="390" width="140" height="150" fill="#cfe2e6" stroke="#334944" stroke-width="3"/><rect x="820" y="390" width="90" height="150" fill="#cfe2e6" stroke="#334944" stroke-width="3"/><path d="M540 420 L540 770" stroke="#a45e3b" stroke-width="4" stroke-dasharray="10 8"/><text x="1050" y="430" font-size="24">2-qavat hajmi</text><text x="1050" y="620" font-size="24">1-qavat bazasi</text><text x="250" y="860" font-size="22">Ichki qavat mantiqi fasad ritmi, kirish, teras va hajm nisbatlarida o‘qilishi kerak.</text><text x="70" y="982" font-size="18" fill="#6c6a63">Konseptual massing eskizi; fasad materiali va detal yechimi alohida ishlab chiqiladi.</text></g></svg>