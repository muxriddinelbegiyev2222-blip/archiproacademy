<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbf5e8"/><g font-family="DejaVu Sans,Segoe UI,sans-serif" fill="#243c38"><text x="70" y="72" font-size="22" fill="#a45e3b">L08_M04_003 · O‘QUV ESKIZI</text><text x="70" y="122" font-size="36" font-weight="700" fill="#0e5757">ZINAPOYA BO‘SHLIG‘I — PLITADAGI ODDIY TEShIK EMAS</text><rect x="220" y="255" width="1090" height="560" fill="#dfe3dc" stroke="#334944" stroke-width="4"/><rect x="600" y="390" width="330" height="300" fill="#fbf5e8" stroke="#a45e3b" stroke-width="6"/><g stroke="#334944" stroke-width="4"><line x1="620" y1="650" x2="900" y2="420"/><line x1="650" y1="650" x2="930" y2="420"/></g><text x="620" y="365" font-size="27" fill="#a45e3b">ZINAPOYA BO‘SHLIG‘I</text><text x="240" y="865" font-size="22">Ochilish konturi tayanch, zinapoya geometriyasi va kesim bilan birga tekshiriladi.</text><text x="240" y="905" font-size="22">Teshik kattalashsa, faqat plita maydoni emas — konstruktiv yechim ham qayta ko‘riladi.</text><text x="70" y="982" font-size="18" fill="#6c6a63">Konseptual koordinatsiya eskizi; ochilish atrofidagi konstruksiya hisob bilan aniqlanadi.</text></g></svg>