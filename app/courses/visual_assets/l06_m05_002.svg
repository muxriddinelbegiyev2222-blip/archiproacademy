<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L06_M05_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Profile Manager bilan ishlash</text><text x="45" y="155" font-size="17" fill="#0E5558">Oddiy L-shaklli profilni 300×300 mm tashqi kontur va 100 mm o‘quv tokcha bilan chizamiz.</text><g transform="translate(0,80)"><polygon points="250,240 650,240 650,375 385,375 385,640 250,640" fill="#C9AD84" stroke="#0E5558" stroke-width="5"/><line x1="250" y1="690" x2="650" y2="690" stroke="#0E5558" stroke-width="2"/><line x1="250" y1="682" x2="250" y2="698" stroke="#0E5558" stroke-width="2"/><line x1="650" y1="682" x2="650" y2="698" stroke="#0E5558" stroke-width="2"/><text x="408.0" y="678" font-size="21" fill="#0E5558">300 mm</text><text x="440" y="435" font-size="25" fill="#0E5558">Tokcha: 100 mm</text><circle cx="650" cy="210" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="643" y="218" font-size="22" fill="#FFFDF7">2</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Profile Managerda kontur, material va foydalaniladigan element turini belgilang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>