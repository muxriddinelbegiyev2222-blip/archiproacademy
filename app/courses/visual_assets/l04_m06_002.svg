<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L04_M06_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Banja va uy aloqasi</text><text x="45" y="155" font-size="17" fill="#0E5558">Banja sxemasida kirish, kiyinish, yuvinish va dam olish; uy bilan nam va quruq aloqa ajratiladi.</text><g transform="translate(0,80)"><rect x="90" y="270" width="210" height="200" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="115" y="365" font-size="22" fill="#0E5558">KIRISH</text><line x1="303" y1="370" x2="345" y2="370" stroke="#A65D35" stroke-width="4"/><path d="M345, 370 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 345 370)"/><rect x="350" y="270" width="210" height="200" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="375" y="365" font-size="22" fill="#0E5558">KIYINISH</text><line x1="563" y1="370" x2="605" y2="370" stroke="#A65D35" stroke-width="4"/><path d="M605, 370 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 605 370)"/><rect x="610" y="270" width="210" height="200" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="635" y="365" font-size="22" fill="#0E5558">YUVINISH</text><line x1="823" y1="370" x2="865" y2="370" stroke="#A65D35" stroke-width="4"/><path d="M865, 370 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 865 370)"/><rect x="870" y="270" width="210" height="200" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="895" y="365" font-size="22" fill="#0E5558">DAM</text><line x1="610" y1="240" x2="610" y2="525" stroke="#A65D35" stroke-width="3" stroke-dasharray="9 7"/><text x="270" y="580" font-size="25" fill="#0E5558">QURUQ</text><text x="635" y="580" font-size="25" fill="#A65D35">NAM</text><circle cx="315" cy="630" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="308" y="638" font-size="22" fill="#FFFDF7">2</text><text x="220" y="690" font-size="24" fill="#0E5558">Nam foydalanish, qaytish yo‘li va xizmatni ajrating.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Uyga qaytadigan odamning nam va quruq yo‘lini ajrating</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>