<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L10_M06_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Wall, slab, column va openings</text><text x="45" y="155" font-size="17" fill="#0E5558">Tasdiqlangan eskizdan qavat, o‘q, devor, slab va ochilishlar bilan BIM asosini yaratamiz.</text><g transform="translate(0,80)"><rect x="195" y="195" width="620" height="465" fill="#FFFDF7" stroke="#0E5558" stroke-width="8"/><line x1="470" y1="660" x2="570" y2="660" stroke="#FFFDF7" stroke-width="12"/><line x1="470" y1="655" x2="470" y2="555" stroke="#0E5558" stroke-width="3"/><path d="M570,655 A100,100 0 0,0 470,555" fill="none" stroke="#0E5558" stroke-width="2"/><line x1="310" y1="195" x2="495" y2="195" stroke="#D5E7ED" stroke-width="12"/><rect x="280" y="235" width="248" height="310" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="293" y="250" width="100" height="42" fill="#FFFDF7" stroke="#0E5558" stroke-width="2"/><rect x="410" y="250" width="100" height="42" fill="#FFFDF7" stroke="#0E5558" stroke-width="2"/><rect x="707" y="220" width="93" height="310" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><text x="302" y="382" font-size="24" fill="#0E5558">KROVAT</text><text x="300" y="420" font-size="22" fill="#0E5558">1,6 × 2 m</text><rect x="545" y="235" width="140" height="310" fill="none" stroke="#A65D35" stroke-width="5"/><circle cx="565" cy="585" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="558" y="593" font-size="22" fill="#FFFDF7">1</text><text x="592" y="593" font-size="21" fill="#0E5558">Foydalanish / shkaf</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Asosiy devor va slabdan keyin ustun/ochilishlarni joylang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>