<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbf5e8"/><g font-family="DejaVu Sans,Segoe UI,sans-serif" fill="#243c38"><text x="70" y="74" font-size="22" fill="#a45e3b">L08_M02_005 · O‘QUV ESKIZI</text><text x="70" y="122" font-size="38" font-weight="700" fill="#0e5757">DEVOR KONSTRUKSIYASI AUDITI</text>
<g fill="#fffdf8" stroke="#b9aa90" stroke-width="2"><rect x="85" y="200" width="410" height="620" rx="18"/><rect x="563" y="200" width="410" height="620" rx="18"/><rect x="1040" y="200" width="410" height="620" rx="18"/></g>
<text x="120" y="250" font-size="26" font-weight="700">1 · VAZIFA VA YUK YO‘LI</text><path d="M180 330 L400 330 L400 690 L180 690 Z" fill="#eee5d8" stroke="#334944" stroke-width="3"/><line x1="290" y1="285" x2="290" y2="325" stroke="#a45e3b" stroke-width="6"/><text x="120" y="760" font-size="21">Ko‘taruvchi / to‘ldiruvchi / partition?</text>
<text x="595" y="250" font-size="26" font-weight="700">2 · OCHILISH VA QAVATLAR</text><rect x="645" y="330" width="245" height="360" fill="#eadfce" stroke="#334944" stroke-width="3"/><rect x="710" y="485" width="120" height="205" fill="#fbf5e8" stroke="#334944" stroke-width="3"/><line x1="768" y1="300" x2="768" y2="470" stroke="#a45e3b" stroke-width="6"/><text x="595" y="760" font-size="21">Katta ochilish va yuqori tayanch mosmi?</text>
<text x="1075" y="250" font-size="26" font-weight="700">3 · MODEL VA MUVOFIQLIK</text><g stroke="#334944" stroke-width="3" fill="none"><rect x="1120" y="330" width="250" height="120"/><rect x="1120" y="495" width="250" height="120"/></g><text x="1160" y="405" font-size="24">PLAN</text><text x="1155" y="570" font-size="24">KESIM</text><path d="M1245 450 L1245 495" stroke="#0e5757" stroke-width="5"/><text x="1075" y="760" font-size="21">Oxirgi versiya va konflikt qaydi bir xilmi?</text>
<rect x="210" y="860" width="1110" height="70" rx="14" fill="#fffdf8" stroke="#a45e3b" stroke-width="2"/><text x="250" y="905" font-size="24">Audit natijasi — taxminiy konstruktiv yechim emas, tekshiriladigan savollar va kelishilgan qarorlar ro‘yxati.</text><text x="70" y="984" font-size="18" fill="#6c6a63">Professional koordinatsiya uchun konstruktorning oxirgi modeli/chizmasi bilan solishtiriladi.</text></g></svg>