<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A65D35"/></marker></defs><rect width="1000" height="650" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="40" y="55" font-size="30" fill="#0E5558">Devorlar: konstruktiv vazifasi farq qiladi</text><rect x="150" y="220" width="250" height="70" fill="#EAE4D6" stroke="#203B36" stroke-width="4"/><rect x="590" y="220" width="250" height="25" fill="#DBE9E8" stroke="#203B36" stroke-width="4"/><line x1="270" y1="115" x2="270" y2="200" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><text x="125" y="370" font-size="23" fill="#203B36">Yuk ko‘taruvchi devor</text><text x="590" y="370" font-size="23" fill="#203B36">Bo‘luvchi devor</text><text x="125" y="450" font-size="25" fill="#203B36">Vazifani qalinlikning o‘zidan aniqlamang.</text><text x="40" y="625" font-size="17" fill="#0E5558">O‘quv sxemasi. O‘lcham va konstruktiv yechim loyiha talabi emas.</text></g></svg>