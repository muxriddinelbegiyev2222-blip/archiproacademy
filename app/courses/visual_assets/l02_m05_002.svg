<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L02_M05_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Ishchi uchburchak</text><text x="45" y="155" font-size="17" fill="#0E5558">Oshxonada sovutgich, rakovina, pishirish joyi va dining mavjud. Tayyorlash tartibi:</text><text x="45" y="181" font-size="17" fill="#0E5558">saqlash→yuvish→tayyorlash→pishirish.</text><g transform="translate(0,80)"><rect x="145" y="190" width="720" height="390" fill="#FFFDF7" stroke="#0E5558" stroke-width="8"/><rect x="190" y="245" width="150" height="95" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="425" y="245" width="150" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><rect x="425" y="455" width="150" height="95" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="685" y="330" width="140" height="100" fill="#E9E1D3" stroke="#0E5558" stroke-width="3"/><text x="195" y="230" font-size="20" fill="#0E5558">SOVUTGICH</text><text x="435" y="230" font-size="20" fill="#0E5558">YUVISH</text><text x="435" y="435" font-size="20" fill="#0E5558">PISHIRISH</text><text x="702" y="385" font-size="23" fill="#0E5558">STOL</text><line x1="265" y1="350" x2="500" y2="350" stroke="#A65D35" stroke-width="4"/><path d="M500, 350 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 500 350)"/><line x1="500" y1="355" x2="500" y2="425" stroke="#A65D35" stroke-width="4"/><path d="M500, 425 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(90.0 500 425)"/><line x1="475" y1="445" x2="265" y2="365" stroke="#A65D35" stroke-width="4"/><path d="M265, 365 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-159.14554196042167 265 365)"/><text x="210" y="650" font-size="23" fill="#0E5558">Uch nuqta va ovqatlanish oqimi: bir-birini kesishini tekshiring.</text><circle cx="400" cy="600" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="393" y="608" font-size="22" fill="#FFFDF7">2</text><text x="427" y="608" font-size="21" fill="#0E5558">Ish yo‘li</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Uch asosiy nuqtani bog‘lab, yo‘lni dining oqimi bilan solishtiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>