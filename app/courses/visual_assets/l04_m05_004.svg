<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L04_M05_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Suv, saqlash va service</text><text x="45" y="155" font-size="17" fill="#0E5558">Yozgi oshxonada tayyorlash, mangal, yuvish va dining mavjud; bolalar yo‘li yonidan o‘tadi.</text><g transform="translate(0,80)"><rect x="160" y="220" width="810" height="410" fill="#FFFDF7" stroke="#0E5558" stroke-width="5"/><rect x="195" y="265" width="160" height="85" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="203" y="310" font-size="18" fill="#0E5558">SAQLASH</text><rect x="380" y="265" width="160" height="85" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="388" y="310" font-size="18" fill="#0E5558">YUVISH</text><rect x="565" y="265" width="160" height="85" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="573" y="310" font-size="18" fill="#0E5558">TAYYORLASH</text><rect x="750" y="265" width="160" height="85" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="758" y="310" font-size="18" fill="#0E5558">MANGAL</text><line x1="280" y1="380" x2="820" y2="380" stroke="#A65D35" stroke-width="4"/><path d="M820, 380 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 820 380)"/><rect x="270" y="465" width="230" height="100" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><text x="310" y="525" font-size="23" fill="#0E5558">TASHQI STOL</text><rect x="750" y="455" width="170" height="125" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="765" y="520" font-size="24" fill="#0E5558">O‘YIN</text><line x1="760" y1="410" x2="545" y2="425" stroke="#A65D35" stroke-width="4"/><path d="M545, 425 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(176.0090869015702 545 425)"/><line x1="545" y1="425" x2="500" y2="500" stroke="#A65D35" stroke-width="4"/><path d="M500, 500 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(120.96375653207352 500 500)"/><line x1="720" y1="400" x2="720" y2="600" stroke="#A65D35" stroke-width="3" stroke-dasharray="9 7"/><circle cx="400" cy="230" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="393" y="238" font-size="22" fill="#FFFDF7">4</text><text x="180" y="690" font-size="24" fill="#0E5558">Issiq idish / tutun / bolalar oqimi: alohida tekshiruv.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Suv, chiqindi va idish saqlashni ish joyiga bog‘lang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>