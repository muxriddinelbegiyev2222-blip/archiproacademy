<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L10_M08_001  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Tom konsepsiyasi</text><text x="45" y="155" font-size="17" fill="#0E5558">L-shaklli uy tomining ikki varianti: sodda hajmlar va murakkab tutashuvli yechim.</text><g transform="translate(0,80)"><polygon points="180,210 820,210 820,430 560,430 560,600 180,600" fill="#DBE9E2" stroke="#0E5558" stroke-width="5"/><line x1="370" y1="210" x2="370" y2="600" stroke="#0E5558" stroke-width="4"/><line x1="370" y1="320" x2="820" y2="320" stroke="#0E5558" stroke-width="4"/><line x1="370" y1="320" x2="560" y2="430" stroke="#A65D35" stroke-width="4"/><line x1="290" y1="300" x2="205" y2="300" stroke="#A65D35" stroke-width="4"/><path d="M205, 300 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(180.0 205 300)"/><line x1="665" y1="350" x2="665" y2="420" stroke="#A65D35" stroke-width="4"/><path d="M665, 420 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(90.0 665 420)"/><line x1="470" y1="480" x2="555" y2="480" stroke="#A65D35" stroke-width="4"/><path d="M555, 480 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 555 480)"/><text x="760" y="510" font-size="24" fill="#A65D35">Suv yo‘li</text><circle cx="180" cy="185" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="173" y="193" font-size="22" fill="#FFFDF7">1</text><text x="207" y="193" font-size="21" fill="#0E5558">Hajm</text><text x="180" y="695" font-size="23" fill="#0E5558">Murakkab tutashuv: geometriya va suv chiqarishni birga tekshiring.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Uy hajmini alohida qismlarga ajrating</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>