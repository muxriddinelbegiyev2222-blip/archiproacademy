<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L03_M06_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Mashina va piyoda xavfsizligi</text><text x="45" y="155" font-size="17" fill="#0E5558">Ikki avtomobil uchun navес va uyga piyoda yo‘lini loyihalash sxemasi tuziladi.</text><g transform="translate(0,80)"><rect x="160" y="170" width="670" height="425" fill="#DBE9E2" stroke="#0E5558" stroke-width="4"/><rect x="160" y="610" width="670" height="45" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><text x="230" y="643" font-size="23" fill="#0E5558">KO‘CHA</text><line x1="90" y1="280" x2="90" y2="195" stroke="#0E5558" stroke-width="4"/><path d="M90, 195 l-12,-5 l0,10 Z" fill="#0E5558" transform="rotate(-90.0 90 195)"/><text x="50" y="165" font-size="21" fill="#0E5558">SHIMOL</text><rect x="275" y="240" width="170" height="280" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><rect x="290" y="290" width="140" height="150" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="360" y1="240" x2="360" y2="520" stroke="#A65D35" stroke-width="2" stroke-dasharray="9 7"/><rect x="550" y="240" width="170" height="280" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><rect x="565" y="290" width="140" height="150" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="635" y1="240" x2="635" y2="520" stroke="#A65D35" stroke-width="2" stroke-dasharray="9 7"/><line x1="750" y1="595" x2="750" y2="300" stroke="#0E5558" stroke-width="4"/><path d="M750, 300 l-12,-5 l0,10 Z" fill="#0E5558" transform="rotate(-90.0 750 300)"/><text x="760" y="550" font-size="20" fill="#0E5558">Piyoda</text><rect x="695" y="255" width="100" height="340" fill="none" stroke="#A65D35" stroke-width="5"/><text x="155" y="705" font-size="23" fill="#0E5558">Mashina gabariti, eshik ochilishi va manevrni birga tekshiring.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Piyoda yo‘lini orqaga yuruvchi mashina zonasidan ajrating</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>