<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A65D35"/></marker></defs><rect width="1000" height="650" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="40" y="55" font-size="30" fill="#0E5558">Tom cho‘qqisi, bo‘g‘ot va qiyalik</text><line x1="150" y1="400" x2="500" y2="170" stroke="#0E5558" stroke-width="8" /><line x1="500" y1="170" x2="850" y2="400" stroke="#0E5558" stroke-width="8" /><line x1="150" y1="400" x2="850" y2="400" stroke="#203B36" stroke-width="3" /><line x1="500" y1="170" x2="500" y2="400" stroke="#A65D35" stroke-width="3" stroke-dasharray="10 8"/><text x="205" y="445" font-size="30" fill="#A65D35">L = 3 m</text><text x="525" y="315" font-size="30" fill="#A65D35">h = 1,5 m</text><text x="380" y="115" font-size="25" fill="#203B36">Cho‘qqi (ridge)</text><text x="100" y="515" font-size="24" fill="#203B36">6 m umumiy oraliq → bitta nishab uchun 3 m</text><text x="100" y="565" font-size="25" fill="#A65D35">Qiyalik = 1,5 ÷ 3 × 100 = 50% (50° emas)</text><text x="40" y="625" font-size="17" fill="#0E5558">O‘quv sxemasi. O‘lcham va konstruktiv yechim loyiha talabi emas.</text></g></svg>