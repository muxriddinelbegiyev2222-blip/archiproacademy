<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L08_M01_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Arxitektura loyihasida fundament koordinatsiyasi</text><text x="45" y="155" font-size="17" fill="#0E5558">Eskizda fundament chizilgan, lekin geologiya va yuk ma’lumoti yo‘q. Qarorni tekshirish uchun konstruktorga</text><text x="45" y="181" font-size="17" fill="#0E5558">kirish ma’lumotlari tayyorlanadi.</text><g transform="translate(0,80)"><rect x="230" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="795" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="230" y="365" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="230" y="555" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><line x1="230" y1="220" x2="535" y2="130" stroke="#0E5558" stroke-width="6"/><line x1="535" y1="130" x2="840" y2="220" stroke="#0E5558" stroke-width="6"/><text x="855" y="378" font-size="22" fill="#0E5558">+3.000</text><text x="855" y="580" font-size="22" fill="#0E5558">±0.000</text><rect x="120" y="590" width="820" height="75" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><rect x="185" y="575" width="135" height="45" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><rect x="750" y="575" width="135" height="45" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><line x1="252" y1="425" x2="252" y2="560" stroke="#A65D35" stroke-width="4"/><path d="M252, 560 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(90.0 252 560)"/><line x1="817" y1="425" x2="817" y2="560" stroke="#A65D35" stroke-width="4"/><path d="M817, 560 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(90.0 817 560)"/><text x="350" y="645" font-size="24" fill="#0E5558">