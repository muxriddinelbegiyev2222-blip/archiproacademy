<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L09_M06_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Eshik, koridor va zinapoya</text><text x="45" y="155" font-size="17" fill="#0E5558">Yotoqxonadan tashqariga yo‘l ikki eshik va yo‘lakdan o‘tadi; bitta shkaf yo‘lga chiqib turibdi.</text><g transform="translate(0,80)"><rect x="145" y="245" width="320" height="270" fill="#FFFDF7" stroke="#0E5558" stroke-width="6"/><rect x="465" y="245" width="460" height="270" fill="#FFFDF7" stroke="#0E5558" stroke-width="6"/><line x1="465" y1="400" x2="465" y2="485" stroke="#FFFDF7" stroke-width="10"/><line x1="465" y1="480" x2="465" y2="400" stroke="#0E5558" stroke-width="3"/><path d="M545,480 A80,80 0 0,0 465,400" fill="none" stroke="#0E5558" stroke-width="2"/><line x1="800" y1="515" x2="890" y2="515" stroke="#FFFDF7" stroke-width="10"/><line x1="800" y1="510" x2="800" y2="425" stroke="#0E5558" stroke-width="3"/><path d="M885,510 A85,85 0 0,0 800,425" fill="none" stroke="#0E5558" stroke-width="2"/><text x="210" y="300" font-size="27" fill="#0E5558">XONA</text><text x="545" y="300" font-size="27" fill="#0E5558">YO‘LAK</text><line x1="245" y1="410" x2="610" y2="410" stroke="#A65D35" stroke-width="4"/><path d="M610, 410 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 610 410)"/><line x1="610" y1="410" x2="845" y2="455" stroke="#A65D35" stroke-width="4"/><path d="M845, 455 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(10.840305454330565 845 455)"/><line x1="845" y1="455" x2="845" y2="600" stroke="#A65D35" stroke-width="4"/><path d="M845, 600 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(90.0 845 600)"/><text x="700" y="645" font-size="25" fill="#0E5558">TASHQARIGA</text><rect x="650" y="380" width="75" height="85" fill="#D99883" stroke="#A43D32" stroke-width="3"/><text x="575" y="350" font-size="23" fill="#A43D32">TO‘SIQ: SHKAF</text><rect x="790" y="440" width="120" height="105" fill="none" stroke="#A65D35" stroke-width="5"/><text x="135" y="710" font-size="22" fill="#0E5558">Yo‘nalish va masofa tegishli obyekt/band bo‘yicha tekshiriladi.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Eshik ochilishi, koridor va zinapoyani birga tekshiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>