<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L07_M03_005  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Model View Options professional audit</text><text x="45" y="155" font-size="17" fill="#0E5558">Ayni model uchun soddalashtirilgan plan va batafsil hujjat ko‘rinishi yaratiladi.</text><g transform="translate(0,80)"><rect x="180" y="240" width="65" height="280" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="135" y="565" font-size="23" fill="#0E5558">ODDIY</text><rect x="470" y="240" width="65" height="280" fill="#F1DFC6" stroke="#0E5558" stroke-width="3"/><text x="425" y="565" font-size="23" fill="#0E5558">MEZON</text><rect x="760" y="240" width="65" height="280" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="715" y="565" font-size="23" fill="#0E5558">NATIJA</text><line x1="110" y1="520" x2="985" y2="520" stroke="#0E5558" stroke-width="5"/><circle cx="790" cy="610" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="783" y="618" font-size="22" fill="#FFFDF7">5</text><text x="120" y="675" font-size="24" fill="#0E5558">Soddalashtirilgan va batafsil ko‘rinish — ayni model.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Ikki viewni bir model bilan solishtiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>