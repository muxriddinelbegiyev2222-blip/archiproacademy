<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L14_M03_002  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Bino sathi va terrain</text><text x="45" y="155" font-size="17" fill="#0E5558">10 m yo‘nalishda 1 m sath farqi; bino, kirish va tashqi suv aloqasi kesimda tekshiriladi.</text><g transform="translate(0,80)"><line x1="140" y1="520" x2="880" y2="320" stroke="#0E5558" stroke-width="5"/><text x="105" y="560" font-size="23" fill="#0E5558">A: ±0.000</text><text x="810" y="295" font-size="23" fill="#0E5558">B: +1.000 m</text><rect x="370" y="250" width="270" height="210" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><line x1="340" y1="460" x2="675" y2="460" stroke="#A65D35" stroke-width="5"/><text x="410" y="225" font-size="25" fill="#0E5558">Uy pol sathi</text><line x1="140" y1="625" x2="880" y2="625" stroke="#0E5558" stroke-width="2"/><line x1="140" y1="617" x2="140" y2="633" stroke="#0E5558" stroke-width="2"/><line x1="880" y1="617" x2="880" y2="633" stroke="#0E5558" stroke-width="2"/><text x="468.0" y="613" font-size="21" fill="#0E5558">10 m</text><text x="240" y="690" font-size="28" fill="#A65D35">1 ÷ 10 × 100 = 10% — o‘rtacha nishab</text><circle cx="880" cy="350" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="873" y="358" font-size="22" fill="#FFFDF7">2</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Uy pol sathining ikki variantini terrain bilan solishtiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>