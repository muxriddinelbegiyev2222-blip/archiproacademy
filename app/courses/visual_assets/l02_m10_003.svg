<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L02_M10_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Laundry xonasi</text><text x="45" y="155" font-size="17" fill="#0E5558">Uyda garderob, kir yuvish, ombor va texnik xona kerak; har birining foydalanish va xizmat yo‘li bor.</text><g transform="translate(0,80)"><rect x="145" y="190" width="720" height="390" fill="#FFFDF7" stroke="#0E5558" stroke-width="8"/><line x1="420" y1="580" x2="510" y2="580" stroke="#FFFDF7" stroke-width="12"/><line x1="420" y1="575" x2="420" y2="485" stroke="#0E5558" stroke-width="3"/><path d="M510,575 A90,90 0 0,0 420,485" fill="none" stroke="#0E5558" stroke-width="2"/><line x1="330" y1="190" x2="475" y2="190" stroke="#D5E7ED" stroke-width="12"/><rect x="210" y="250" width="160" height="160" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><text x="220" y="335" font-size="19" fill="#0E5558">JAVON</text><rect x="420" y="250" width="160" height="160" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><text x="430" y="335" font-size="19" fill="#0E5558">KIR YUVISH</text><rect x="645" y="250" width="160" height="160" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><text x="655" y="335" font-size="19" fill="#0E5558">TEXNIK</text><line x1="510" y1="550" x2="590" y2="460" stroke="#A65D35" stroke-width="4"/><path d="M590, 460 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-48.366460663429805 590 460)"/><line x1="590" y1="460" x2="750" y2="460" stroke="#A65D35" stroke-width="4"/><path d="M750, 460 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 750 460)"/><circle cx="500" cy="230" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="493" y="238" font-size="22" fill="#FFFDF7">3</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Kir yuvish mashinasi, ajratish, quritish va yig‘ish tartibini chizing</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>