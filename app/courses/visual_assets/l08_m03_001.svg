<rect x="190" y="830" width="1160" height="95" rx="14" fill="#fffdf8" stroke="#b9aa90" stroke-width="2"/><text x="225" y="870" font-size="23">Karkasni tasodifiy ustunlar yig‘indisi emas, o‘zaro bog‘langan tayanch tizimi sifatida o‘qing.</text><text x="225" y="905" font-size="21" fill="#a45e3b">Element kesimi va oraliq yetarliligi konstruktor hisobi bilan aniqlanadi.</text><text x="70" y="984" font-size="18" fill="#6c6a63">Konseptual arxitektura-konstruksiya eskizi.</text></g></svg>