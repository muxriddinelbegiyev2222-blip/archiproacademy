<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L02_M05_001  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Oshxona funksiyasi va zonalari</text><text x="45" y="155" font-size="17" fill="#0E5558">Oshxonada sovutgich, rakovina, pishirish joyi va dining mavjud. Tayyorlash tartibi:</text><text x="45" y="181" font-size="17" fill="#0E5558">saqlash→yuvish→tayyorlash→pishirish.</text><g transform="translate(0,80)"><rect x="145" y="190" width="720" height="390" fill="#FFFDF7" stroke="#0E5558" stroke-width="8"/><line x1="420" y1="580" x2="510" y2="580" stroke="#FFFDF7" stroke-width="12"/><line x1="420" y1="575" x2="420" y2="485" stroke="#0E5558" stroke-width="3"/><path d="M510,575 A90,90 0 0,0 420,485" fill="none" stroke="#0E5558" stroke-width="2"/><line x1="330" y1="190" x2="475" y2="190" stroke="#D5E7ED" stroke-width="12"/><rect x="190" y="250" width="135" height="95" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><text x="198" y="305" font-size="16" fill="#0E5558">SOVUTGICH</text><rect x="330" y="250" width="135" height="95" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><text x="338" y="305" font-size="16" fill="#0E5558">YUVISH</text><rect x="470" y="250" width="135" height="95" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><text x="478" y="305" font-size="16" fill="#0E5558">TAYYORLASH</text><rect x="610" y="250" width="135" height="95" fill="#DBE9E2" stroke="#203B36" stroke-width="3"/><text x="618" y="305" font-size="16" fill="#0E5558">PISHIRISH</text><rect x="615" y="420" width="145" height="85" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><text x="635" y="470" font-size="22" fill="#0E5558">STOL</text><line x1="250" y1="370" x2="400" y2="370" stroke="#A65D35" stroke-width="4"/><path d="M400, 370 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 400 370)"/><line x1="400" y1="370" x2="540" y2="370" stroke="#A65D35" stroke-width="4"/><path d="M540, 370 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 540 370)"/><line x1="540" y1="370" x2="680" y2="370" stroke="#A65D35" stroke-width="4"/><path d="M680, 370 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(0.0 680 370)"/><circle cx="235" cy="205" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="228" y="213" font-size="22" fill="#FFFDF7">1</text><text x="262" y="213" font-size="21" fill="#0E5558">Saqlash</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">To‘rtta ishni planda ketma-ket belgilang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>