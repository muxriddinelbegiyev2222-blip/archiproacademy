<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L11_M02_003  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Wet zones va service stack</text><text x="45" y="155" font-size="17" fill="#0E5558">Ikki qavatda sanuzellar ustma-ust, yotoqxonalar yuqorida; pastda mehmon oqimi mavjud.</text><g transform="translate(0,80)"><rect x="230" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="795" y="230" width="45" height="340" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><rect x="230" y="365" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><rect x="230" y="555" width="610" height="25" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><line x1="230" y1="220" x2="535" y2="130" stroke="#0E5558" stroke-width="6"/><line x1="535" y1="130" x2="840" y2="220" stroke="#0E5558" stroke-width="6"/><text x="855" y="378" font-size="22" fill="#0E5558">+3.000</text><text x="855" y="580" font-size="22" fill="#0E5558">±0.000</text><text x="350" y="310" font-size="25" fill="#0E5558">1-QAVAT: TINCH ZONA</text><text x="350" y="500" font-size="25" fill="#0E5558">0-QAVAT: UMUMIY ZONA</text><rect x="670" y="260" width="100" height="95" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><rect x="670" y="445" width="100" height="95" fill="#D5E7ED" stroke="#203B36" stroke-width="3"/><line x1="720" y1="240" x2="720" y2="555" stroke="#A65D35" stroke-width="5"/><text x="470" y="645" font-size="23" fill="#0E5558">Nam zonalar va tayanchlar ustma-ust tekshiriladi.</text><circle cx="480" cy="355" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="473" y="363" font-size="22" fill="#FFFDF7">3</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Nam xonalar va quvur yo‘lini ustma-ust solishtiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>