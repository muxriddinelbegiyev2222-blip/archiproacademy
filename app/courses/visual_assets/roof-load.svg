<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A65D35"/></marker></defs><rect width="1000" height="650" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="40" y="55" font-size="30" fill="#0E5558">Tomning yuk uzatish yo‘li</text><rect x="150" y="340" width="25" height="200" fill="#EAE4D6" stroke="#203B36" stroke-width="4"/><rect x="825" y="340" width="25" height="200" fill="#EAE4D6" stroke="#203B36" stroke-width="4"/><line x1="125" y1="350" x2="500" y2="120" stroke="#0E5558" stroke-width="8" /><line x1="500" y1="120" x2="875" y2="350" stroke="#0E5558" stroke-width="8" /><line x1="390" y1="230" x2="240" y2="325" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><line x1="610" y1="230" x2="760" y2="325" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><line x1="162" y1="380" x2="162" y2="515" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><line x1="837" y1="380" x2="837" y2="515" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><text x="295" y="80" font-size="24" fill="#203B36">Tom → tayanch → devor → fundament</text><text x="355" y="435" font-size="30" fill="#A65D35">Yuk yo‘li</text><text x="40" y="625" font-size="17" fill="#0E5558">O‘quv sxemasi. O‘lcham va konstruktiv yechim loyiha talabi emas.</text></g></svg>