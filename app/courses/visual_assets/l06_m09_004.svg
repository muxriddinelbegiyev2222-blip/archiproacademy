<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L06_M09_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Uy va relyef aloqasi</text><text x="45" y="155" font-size="17" fill="#0E5558">Meshda A nuqta 0.000, B nuqta +0.500 m, orasida 10 m. Uy pol sathi alohida ko‘rsatiladi.</text><g transform="translate(0,80)"><line x1="140" y1="520" x2="880" y2="320" stroke="#0E5558" stroke-width="5"/><text x="105" y="560" font-size="23" fill="#0E5558">A: ±0.000</text><text x="810" y="295" font-size="23" fill="#0E5558">B: +0.500 m</text><rect x="370" y="250" width="270" height="210" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><line x1="340" y1="460" x2="675" y2="460" stroke="#A65D35" stroke-width="5"/><text x="410" y="225" font-size="25" fill="#0E5558">Uy pol sathi</text><line x1="140" y1="625" x2="880" y2="625" stroke="#0E5558" stroke-width="2"/><line x1="140" y1="617" x2="140" y2="633" stroke="#0E5558" stroke-width="2"/><line x1="880" y1="617" x2="880" y2="633" stroke="#0E5558" stroke-width="2"/><text x="468.0" y="613" font-size="21" fill="#0E5558">10 m</text><text x="240" y="690" font-size="28" fill="#A65D35">0.5 ÷ 10 × 100 = 5% — o‘rtacha nishab</text><polygon points="375,457 640,385 640,457" fill="#F1DFC6" stroke="#A65D35" stroke-width="3"/><line x1="720" y1="365" x2="540" y2="410" stroke="#A65D35" stroke-width="4"/><path d="M540, 410 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(165.96375653207352 540 410)"/><text x="715" y="355" font-size="22" fill="#A65D35">Yer ishlari</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Uy konturi va kirishni relyefga joylashtiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ 