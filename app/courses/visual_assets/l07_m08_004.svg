<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L07_M08_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Murakkab loyiha strukturasini boshqarish</text><text x="45" y="155" font-size="17" fill="#0E5558">Bir xil xona moduli ikki marta hotlink sifatida joylanadi. Manba moduli va joylangan nusxalar farqlanadi.</text><g transform="translate(0,80)"><rect x="100" y="250" width="240" height="220" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><text x="130" y="290" font-size="23" fill="#0E5558">MODULE MANBA</text><line x1="350" y1="360" x2="510" y2="285" stroke="#A65D35" stroke-width="4"/><path d="M510, 285 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(-25.114834886144564 510 285)"/><rect x="525" y="205" width="300" height="160" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="550" y="295" font-size="24" fill="#0E5558">HOTLINK NUSXA</text><rect x="545" y="315" width="80" height="30" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><line x1="350" y1="360" x2="510" y2="525" stroke="#A65D35" stroke-width="4"/><path d="M510, 525 l-12,-5 l0,10 Z" fill="#A65D35" transform="rotate(45.88140399658214 510 525)"/><rect x="525" y="445" width="300" height="160" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><text x="550" y="535" font-size="24" fill="#0E5558">HOTLINK NUSXA</text><rect x="545" y="555" width="80" height="30" fill="#DBE9E2" stroke="#0E5558" stroke-width="3"/><circle cx="500" cy="350" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="493" y="358" font-size="22" fill="#FFFDF7">4</text><text x="100" y="700" font-size="23" fill="#0E5558">Manba, joylashuv, ID va yangilanishni alohida tekshiring.</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Manba o‘zgarganda yangilanishni tekshiring, mahalliy o‘zgarishlarni qayd qiling</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>