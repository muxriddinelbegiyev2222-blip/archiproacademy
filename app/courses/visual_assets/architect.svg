<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A65D35"/></marker></defs><rect width="1000" height="650" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="40" y="55" font-size="30" fill="#0E5558">Arxitektor: istakdan aniq topshiriqqa</text><rect x="50" y="220" width="275" height="170" fill="#E2E9DF" stroke="#203B36" stroke-width="4"/><text x="65" y="270" font-size="25" fill="#203B36">SAVOL</text><text x="65" y="320" font-size="19" fill="#203B36">Kim? Qachon? Nima?</text><line x1="330" y1="300" x2="355" y2="300" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><rect x="360" y="220" width="275" height="170" fill="#E2E9DF" stroke="#203B36" stroke-width="4"/><text x="375" y="270" font-size="25" fill="#203B36">TOPSHIRIQ</text><text x="375" y="320" font-size="19" fill="#203B36">Xona va vazifalar</text><line x1="640" y1="300" x2="665" y2="300" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><rect x="670" y="220" width="275" height="170" fill="#E2E9DF" stroke="#203B36" stroke-width="4"/><text x="685" y="270" font-size="25" fill="#203B36">YECHIM</text><text x="685" y="320" font-size="19" fill="#203B36">Variant va tekshiruv</text><text x="85" y="480" font-size="23" fill="#203B36">Avval sababni tushuning, keyin chizma orqali tekshiring.</text><text x="40" y="625" font-size="17" fill="#0E5558">O‘quv sxemasi. O‘lcham va konstruktiv yechim loyiha talabi emas.</text></g></svg>