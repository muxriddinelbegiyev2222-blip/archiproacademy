<rect x="225" y="900" width="1110" height="55" rx="12" fill="#fffdf8" stroke="#b9aa90" stroke-width="2"/><text x="260" y="936" font-size="21">Karkas arxitektura tugagandan keyin “qo‘shilmaydi” — ular loyiha boshidan birga koordinatsiya qilinadi.</text><text x="70" y="992" font-size="18" fill="#6c6a63">Konseptual konflikt eskizi; ustunni ko‘chirish konstruktor bilan kelishiladi.</text></g></svg>