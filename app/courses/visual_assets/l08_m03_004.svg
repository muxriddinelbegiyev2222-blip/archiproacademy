<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L08_M03_004  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Arxitektura va karkas koordinatsiyasi</text><text x="45" y="155" font-size="17" fill="#0E5558">O‘quv o‘qlar A/B oralig‘i 4000 mm, 1/2 oralig‘i 3000 mm. To‘rtta tayanch va rigellar koordinatsiya qilinadi.</text><g transform="translate(0,80)"><line x1="260" y1="175" x2="260" y2="620" stroke="#0E5558" stroke-width="2" stroke-dasharray="9 7"/><circle cx="260" cy="145" r="25" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="252" y="154" font-size="25" fill="#0E5558">A</text><line x1="780" y1="175" x2="780" y2="620" stroke="#0E5558" stroke-width="2" stroke-dasharray="9 7"/><circle cx="780" cy="145" r="25" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="772" y="154" font-size="25" fill="#0E5558">B</text><line x1="200" y1="200" x2="840" y2="200" stroke="#0E5558" stroke-width="2" stroke-dasharray="9 7"/><circle cx="145" cy="200" r="25" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="137" y="208" font-size="25" fill="#0E5558">1</text><line x1="200" y1="590" x2="840" y2="590" stroke="#0E5558" stroke-width="2" stroke-dasharray="9 7"/><circle cx="145" cy="590" r="25" fill="#FFFDF7" stroke="#0E5558" stroke-width="3"/><text x="137" y="598" font-size="25" fill="#0E5558">2</text><rect x="242" y="182" width="36" height="36" fill="#C9AD84" stroke="#0E5558" stroke-width="3"/><rect x="242" y="572" width="36" height="36" fill="#C9AD84" stroke="#0E5558" stroke-width="3"/><rect x="762" y="182" width="36" height="36" fill="#C9AD84" stroke="#0E5558" stroke-width="3"/><rect x="762" y="572" width="36" height="36" fill="#C9AD84" stroke="#0E5558" stroke-width="3"/><rect x="260" y="200" width="520" height="390" fill="none" stroke="#0E5558" stroke-width="8"/><line x1="260" y1="630" x2="780" y2="630" stroke="#0E5558" stroke-width="2"/><line x1="260" y1="622" x2="260" y2="638" stroke="#0E5558" stroke-width="2"/><line x1="780" y1="622" x2="780" y2="638" stroke="#0E5558" stroke-width="2"/><text x="478.0" y="618" font-size="21" fill="#0E5558">4 000 mm</text><text x="875" y="425" font-size="22" fill="#0E5558">3 000 mm</text><circle cx="520" cy="540" r="18" fill="#0E5558" stroke="#0E5558" stroke-width="3"/><text x="513" y="548" font-size="22" fill="#FFFDF7">4</text></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Ustun o‘rnini eshik, yo‘l va mebel bilan solishtiring</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>