<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#fbf5e8"/><g font-family="DejaVu Sans,Segoe UI,sans-serif" fill="#243c38"><text x="70" y="74" font-size="22" fill="#a45e3b">L08_M03_004 · O‘QUV ESKIZI</text><text x="70" y="122" font-size="38" font-weight="700" fill="#0e5757">USTUNNI XONA, ESHIK VA FASAD BILAN KOORDINATSIYA QILING</text>
<rect x="150" y="230" width="730" height="560" fill="#fffdf8" stroke="#334944" stroke-width="4"/><path d="M150 480 H880 M500 230 V790" stroke="#334944" stroke-width="3"/>
<rect x="470" y="420" width="70" height="70" fill="#b9cfd0" stroke="#334944" stroke-width="3"/><path d="M500 790 L500 675" stroke="#a45e3b" stroke-width="6"/><path d="M500 675 A115 115 0 0 1 615 790" fill="none" stroke="#a45e3b" stroke-width="3"/><text x="360" y="850" font-size="23" fill="#a45e3b">USTUN ESHIK YO‘LIGA TO‘QNASHDI</text>
