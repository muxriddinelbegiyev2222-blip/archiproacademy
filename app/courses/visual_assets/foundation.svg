<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#A65D35"/></marker></defs><rect width="1000" height="650" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="40" y="55" font-size="30" fill="#0E5558">Yuk: tayanch → fundament → grunt</text><rect x="80" y="470" width="840" height="95" fill="#D7BA94" stroke="#203B36" stroke-width="4"/><rect x="360" y="170" width="70" height="280" fill="#EAE4D6" stroke="#203B36" stroke-width="4"/><rect x="290" y="450" width="210" height="55" fill="#DBE9E8" stroke="#203B36" stroke-width="4"/><line x1="395" y1="85" x2="395" y2="155" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><line x1="395" y1="310" x2="395" y2="430" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><line x1="395" y1="510" x2="395" y2="550" stroke="#A65D35" stroke-width="5" marker-end="url(#arrow)"/><text x="540" y="230" font-size="26" fill="#203B36">Yuk ko‘taruvchi element</text><text x="540" y="460" font-size="26" fill="#203B36">Fundament</text><text x="540" y="550" font-size="26" fill="#203B36">Grunt</text><text x="40" y="625" font-size="17" fill="#0E5558">O‘quv sxemasi. O‘lcham va konstruktiv yechim loyiha talabi emas.</text></g></svg>