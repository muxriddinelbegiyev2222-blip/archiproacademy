<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1100" viewBox="0 0 1150 1100"><rect width="1150" height="960" fill="#FFFDF7"/><g font-family="DejaVu Sans, Segoe UI, sans-serif"><text x="45" y="50" font-size="19" fill="#A65D35">L01_M02_005  /  O‘QUV NAMUNASI</text><text x="45" y="92" font-size="29" fill="#0E5558">Proporsiyadagi xatolarni topish</text><text x="45" y="155" font-size="17" fill="#0E5558">O‘quv fasadi 12 m keng va 3 m baland; uchta teng bo‘lakka ajratiladi. Bu estetik nisbat mashqi.</text><g transform="translate(0,80)"><rect x="140" y="320" width="800" height="200" fill="#E9E1D3" stroke="#203B36" stroke-width="3"/><line x1="110" y1="520" x2="990" y2="520" stroke="#0E5558" stroke-width="5"/><rect x="560" y="385" width="60" height="135" fill="#C9AD84" stroke="#203B36" stroke-width="3"/><rect x="270.0" y="365" width="80" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="310" y1="365" x2="310" y2="460" stroke="#0E5558" stroke-width="2"/><rect x="417.5" y="365" width="115" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="475" y1="365" x2="475" y2="460" stroke="#0E5558" stroke-width="2"/><rect x="655.0" y="365" width="80" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="695" y1="365" x2="695" y2="460" stroke="#0E5558" stroke-width="2"/><rect x="820.0" y="365" width="80" height="95" fill="#D5E7ED" stroke="#0E5558" stroke-width="3"/><line x1="860" y1="365" x2="860" y2="460" stroke="#0E5558" stroke-width="2"/><line x1="140" y1="565" x2="940" y2="565" stroke="#0E5558" stroke-width="2"/><line x1="140" y1="557" x2="140" y2="573" stroke="#0E5558" stroke-width="2"/><line x1="940" y1="557" x2="940" y2="573" stroke="#0E5558" stroke-width="2"/><text x="498.0" y="553" font-size="21" fill="#0E5558">12 m</text><text x="50" y="420" font-size="21" fill="#0E5558">3 m</text><line x1="140" y1="235" x2="140" y2="540" stroke="#A65D35" stroke-width="2" stroke-dasharray="9 7"/><line x1="406" y1="235" x2="406" y2="540" stroke="#A65D35" stroke-width="2" stroke-dasharray="9 7"/><line x1="673" y1="235" x2="673" y2="540" stroke="#A65D35" stroke-width="2" stroke-dasharray="9 7"/><line x1="940" y1="235" x2="940" y2="540" stroke="#A65D35" stroke-width="2" stroke-dasharray="9 7"/></g><line x1="45" y1="835" x2="1105" y2="835" stroke="#0E5558" stroke-width="2"/><text x="45" y="875" font-size="22" fill="#0E5558">Bir deraza tasodifan 2 m keng bo‘lsa, sababini izlang</text><text x="45" y="1080" font-size="18" fill="#0E5558">Sxematik tasvir: qurilish detali, normativ minimum yoki haqiqiy Archicad skrinshoti emas.</text></g></svg>